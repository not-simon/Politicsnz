# Publishes the voter guide in site/ to GitHub Pages.
#
# One-time setup (Pages is not available on a private repo without a paid plan):
#   1. Make the repo public (Settings -> General -> Danger Zone -> Change visibility), or upgrade the plan.
#   2. Settings -> Pages -> Source: "GitHub Actions".
#   3. Actions -> "Publish voter guide" -> Run workflow.
# Setup done 23 Oct 2026; the site publishes automatically on every push that changes site/.
name: Publish voter guide
# Commits made by the scheduled bots use the default GITHUB_TOKEN, and GitHub does not start push-triggered workflows for
# those, so this workflow also runs when each bot workflow completes (workflow_run fires on the default branch only).
on:
  push:
    branches: [claude/nz-political-parties-research-hnn8ae, main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_run:
    workflows: ['Update polls and forecast', 'Update party releases', 'Election night results', 'Refresh policies and candidates']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # creates the Pages site on first run once the repo is public / plan allows it
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
