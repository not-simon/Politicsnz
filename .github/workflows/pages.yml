# Publishes the voter guide in site/ to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# (Pages on a private repo needs a paid GitHub plan; on a public repo it's free.)
name: Publish voter guide
on:
  push:
    branches: [claude/nz-political-parties-research-hnn8ae, main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
