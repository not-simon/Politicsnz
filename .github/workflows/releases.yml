# Refreshes the party newsroom feed (data/releases.json) every hour (and on demand).
#
# Requires GitHub Actions to be enabled for the repository (Settings -> Actions -> General -> "Allow all actions"),
# and "Workflow permissions" set to "Read and write" (or rely on the `permissions: contents: write` block below).
# It runs tools/releases_update.py (Scoop InfoPages + Scoop Parliament/Politics RSS + Beehive RSS -> data/releases.json,
# 60-day window, de-duplicated by URL), then tools/build_site.py, and commits only if something changed.
# Safe to run repeatedly: the script is idempotent (a run that finds nothing new leaves data/releases.json byte-identical, so
# no commit is made); a failed fetch keeps the previously stored items for that source and records the error in `sources`.
# One request per feed per run with a fixed User-Agent. Scoop's terms are recorded in the file's `terms_note`; to drop the Scoop
# channel and keep only Beehive + party newsroom links, change the first run step to `python3 tools/releases_update.py --no-scoop`.
# The follow directory (data/guide/follow.json) is rebuilt by hand with `--follow`; it has no feed to poll.
name: Update party releases
on:
  schedule:
    - cron: '41 * * * *'   # hourly (UTC); the odd minute avoids the top-of-hour rush
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: releases
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Polling-day freeze (Electoral Act 1993 s 197)
        # Nothing new is published from 23:59 Fri 6 Nov to 19:00 Sat 7 Nov NZDT (10:59Z 6 Nov to 06:00Z 7 Nov).
        run: |
          now=$(date -u +%s)
          if [ "$now" -ge "$(date -u -d '2026-11-06T10:59:00Z' +%s)" ] && [ "$now" -lt "$(date -u -d '2026-11-07T06:00:00Z' +%s)" ]; then
            echo "Polling-day freeze: skipping this run."; echo "FREEZE=1" >> "$GITHUB_ENV"
          fi
      - name: Refresh party and ministerial releases
        if: env.FREEZE != '1'
        run: python3 tools/releases_update.py
      - name: Rebuild the site bundle
        if: env.FREEZE != '1'
        run: python3 tools/build_site.py
      - name: Commit and push if anything changed
        if: env.FREEZE != '1'
        run: |
          git add data/releases.json site
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "releases-bot"
          git config user.email "releases-bot@users.noreply.github.com"
          git commit -m "Update party releases ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
