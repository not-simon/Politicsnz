    <!-- GPT Early Load: pre-load GPT script so it's ready when the SDK needs it -->
    <script>
      (function () {
        // Only run on web, not native app
        var isNativeApp =
          window.webkit &&
          window.webkit.messageHandlers &&
          window.webkit.messageHandlers.nativeApp;
        if (isNativeApp) return;

        // Initialize GPT command queue (SDK will use this when it loads)
        window.googletag = window.googletag || { cmd: [] };

        // Guard against double injection. Prebid (loaded later by the ads SDK)
        // also injects gpt.js internally. Check for any existing <script>
        // whose src matches the GPT URL so we catch both our own tag and
        // any tag Prebid may have already created.
        var GPT_SRC = 'https://securepubads.g.doubleclick.net/tag/js/gpt.js';
        var scripts = document.getElementsByTagName('script');
        for (var i = 0; i < scripts.length; i++) {
          if (scripts[i].src === GPT_SRC) return;
        }

        // Load GPT script with high priority — this is the key optimisation.
        // By loading GPT in <head> instead of waiting for the SDK bundle,
        // GPT is already available when the SDK initialises, saving ~2-3s.
        var gptScript = document.createElement('script');
        gptScript.src = GPT_SRC;
        gptScript.async = true;
        gptScript.setAttribute('fetchpriority', 'high');
        document.head.appendChild(gptScript);
      })();
    </script>
