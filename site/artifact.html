    const x0 = cx + Math.cos(t) * r0 * R, y0 = cy - Math.sin(t) * r0 * R, x1 = cx + Math.cos(t) * r1 * R, y1 = cy - Math.sin(t) * r1 * R;
    line = `<line class="maj" x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}"/><text class="hemi__maj" x="${x1.toFixed(1)}" y="${(y1 - 4).toFixed(1)}" text-anchor="middle">${maj}</text>` }

const seatTitle = s => s.name ? `${s.name} · ${pname(s.party)}` : `${pname(s.party)} seat`;
// Change seats in place (fills cross-fade through CSS) when the count is unchanged; otherwise redraw (seats pop in).

function scrubberHTML({ id, labels, i, aria = 'Election year', play = 'Play through the years', note = '' }) {
  const fill = labels.length > 1 ? i / (labels.length - 1) * 100 : 0;
  return `<div class="scrubber" id="${id}"><button class="scrubber__play" type="button" aria-label="${esc(play)}">${ic('play')}${ic('pause')}</button>
    <div class="scrubber__main"><div class="scrubber__head"><div class="scrubber__year" aria-live="polite"><span>${esc(labels[i])}</span></div><span class="scrubber__note">${note}</span></div>
      <div class="scrubber__track"><input class="range" type="range" min="0" max="${labels.length - 1}" step="1" value="${i}" aria-label="${esc(aria)}" aria-valuetext="${esc(labels[i])}" style="--fill:${fill}%">
        <div class="scrubber__stops">${labels.map((l, k) => `<span data-k="${k}" aria-current="${k === i}">${esc(l)}</span>`).join('')}</div></div></div></div>` }
function bindScrubber(el, { labels, get, set, play = 'Play through the years' }) {
  const range = el.querySelector('.range'), btn = el.querySelector('.scrubber__play'), yr = el.querySelector('.scrubber__year'), stops = [...el.querySelectorAll('.scrubber__stops span')];
  const sync = i => { range.value = i; range.style.setProperty('--fill', (labels.length > 1 ? i / (labels.length - 1) * 100 : 0) + '%'); range.setAttribute('aria-valuetext', labels[i]);
    stops.forEach((s, k) => s.setAttribute('aria-current', String(k === i))); if (yr.textContent !== labels[i]) yr.innerHTML = `<span>${esc(labels[i])}</span>` };
  const stop = () => { if (S.scrubTimer) { clearInterval(S.scrubTimer); S.scrubTimer = null } el.removeAttribute('data-playing'); btn.setAttribute('aria-label', play) };
  const to = i => { sync(i); set(i) };

  el.querySelector('.scrubber__stops').addEventListener('click', e => { const s = e.target.closest('[data-k]'); if (s) { stop(); to(+s.dataset.k) } });

  return { sync, stop } }

/* ----- find my electorate from location (device-side only) ----- */
function pointInRing(pt, ring) { let inside = false; const [x, y] = pt; for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) { const [xi, yi] = ring[i], [xj, yj] = ring[j]; if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside } return inside }
function featureContains(f, lon, lat) { const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates; for (const poly of polys) { if (pointInRing([lon, lat], poly[0])) { for (let k = 1; k < poly.length; k++) if (pointInRing([lon, lat], poly[k])) return false; return true } } return false }
async function locateElectorate() { if (!navigator.geolocation) throw new Error('Your browser does not offer location.');
  const pos = await new Promise((ok, no) => navigator.geolocation.getCurrentPosition(ok, no, { enableHighAccuracy: false, timeout: 12000, maximumAge: 300000 }));
  let { longitude: lon, latitude: lat } = pos.coords; if (lon < 0) lon += 360;
  await loadGeo(2025); const hit = t => (S.geo[`${t}-2025`].features || []).find(f => featureContains(f, lon, lat));
  return { general: hit('general'), maori: hit('maori'), accuracy: pos.coords.accuracy } }

  try { const r = await locateElectorate(); if (!r.general && !r.maori) { out.innerHTML = '<span class="small">That location is outside New Zealand’s electorates.</span>'; return }
    const E = S.data.electorates || []; const link = f => { const e = E.find(x => slugify(x.slug) === f.properties.slug || slugify(x.name) === f.properties.slug); return e ? `<button class="btn sm" data-go="electorate-${esc(e.slug)}">${esc(f.properties.name)} · ${(e.candidates || []).length} candidates</button>` : `<b>${esc(f.properties.name)}</b>` };

/* ----- auto-link party and politician names in text ----- */
function buildLinker() { if (S.linker !== undefined) return S.linker; const names = [];
  for (const [slug, p] of Object.entries(S.data.parties)) { for (const n of [p.name, p.short]) if (n && n.length > 3 && !/^(Independent|Other)$/i.test(n)) names.push([n, 'party-' + slug]) }
  for (const p of (S.people || [])) if (p.name && p.name.trim().split(/\s+/).length >= 2) names.push([p.name, 'person:' + p.folder]);
  names.sort((a, b) => b[0].length - a[0].length); const map = Object.fromEntries(names);
  const re = new RegExp('(?<![\\w-])(' + names.map(([n]) => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')(?![\\w-])', 'g');
  S.linker = names.length ? { re, map } : null; return S.linker }
function autolink(root) { const L = buildLinker(); if (!L || !root) return; const skip = 'A, BUTTON, H1, H2, H3, H4, .nm, .st, .who, .pcard, .person, .seatcard, .match, .scard, .legend, .tabs, .statement, .scard__s, .potd__s, .release__t, .ptag, .phead, .brand, .src, .release__m, .person__meta, select, input, code, pre';
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => (n.nodeValue.trim().length > 3 && !n.parentElement.closest(skip)) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) { L.re.lastIndex = 0; if (!L.re.test(n.nodeValue)) continue; const frag = document.createDocumentFragment(); let last = 0; L.re.lastIndex = 0; let m;
    while ((m = L.re.exec(n.nodeValue))) { frag.appendChild(document.createTextNode(n.nodeValue.slice(last, m.index))); const b = document.createElement('button'); b.className = 'linkbtn'; b.type = 'button'; b.textContent = m[0];
      const t = L.map[m[0]]; if (t.startsWith('person:')) b.dataset.person = t.slice(7); else b.dataset.go = t; frag.appendChild(b); last = m.index + m[0].length }
    frag.appendChild(document.createTextNode(n.nodeValue.slice(last))); n.parentNode.replaceChild(frag, n) } }

  const mapA = (primary = true) => `<a class="btn ${primary ? 'btn--primary' : 'btn--on-band'} btn--l" href="https://map.vote.nz" target="_blank" rel="noopener">Find a voting place ${ic('ext', 'i--s ext')}</a>`;
  const inA = (href, l, primary = false) => `<a class="btn ${primary ? 'btn--primary' : 'btn--on-band'} btn--l" href="${href}">${l}</a>`;
  if (ph === 'enrol') return { n: toE > 0 ? toE : null, eyebrow, step: 0,
    h1: toE > 1 ? `days left<br>to enrol.` : toE === 1 ? `day left<br>to enrol.` : `Last day<br>to enrol.`,
    p: `Enrolment closes at midnight on Sunday 25 October. This year you can’t enrol at a voting place, so if you’ve moved or never enrolled, do it now. It takes about five minutes.`,
    ctas: vnz('Check I’m enrolled') + inA('#/vote', 'First vote? Start here') };
  if (ph === 'advance') return { n: dl > 0 ? dl : null, eyebrow: nzDateLong() + ' · voting is open', step: 1,
    h1: `${dl > 0 ? `day${dl === 1 ? '' : 's'} to go.<br>` : ''}Vote early, anywhere.`,
    p: `Advance voting is open at any voting place in the country until Friday 6 November. No ID is needed, and you can vote outside your own electorate. Hours vary, so check the official map first.`,
    ctas: mapA() + inA('#/vote/plan', 'Make a plan') };
  if (ph === 'electionday') return { n: null, eyebrow: nzDateLong() + ' · election day', step: 2,
    h1: `Today’s the day.`,
    p: `Voting places are open 9am to 7pm. You can vote at any voting place in New Zealand, and you don’t need ID or your EasyVote card.`,
    ctas: mapA() + inA('#/vote', 'What to expect inside') };
  if (ph === 'results') return { n: null, eyebrow: nzDateLong() + ' · voting has closed', step: 2,
    h1: `Results are<br>coming in.`,
    p: `These are preliminary election-night results. Special votes are counted later, so seats can still change; the official result is due on Friday 27 November.`,
    ctas: inA('#/seats/results', 'See the results', true) + inA('#/vote/specials', 'What specials could change') };
  if (t.num < 20261127) return { n: toFinal > 0 ? toFinal : null, eyebrow: nzDateLong() + ' · special votes are being counted', step: 3,
    h1: `${toFinal > 0 ? `day${toFinal === 1 ? '' : 's'} to the<br>` : ''}final result.`,
    p: `Special votes, including overseas votes, are being checked and counted. The official result is due on Friday 27 November; until then, seat counts can move.`,
    ctas: inA('#/vote/specials', 'What specials could change', true) + inA('#/seats/parliament', 'Parliament now') };
  return { n: null, eyebrow: nzDateLong(), step: 4, h1: `Forming a<br>government.`,
    p: `The official result is in. Under MMP one party rarely governs alone, so parties negotiate coalition or support agreements. There is no deadline for this.`,
    ctas: inA('#/seats/coalition', 'Coalition builder', true) + inA('#/vote/glossary', 'What the terms mean') } }

/* ----- the Today feed ----- */
function potdCard() { const cards = (S.swipe || []).filter(c => c && c.statement && c.statement.length <= 220); if (!cards.length) return null;
  // equal chance for every registered party (some parties have far more cards than others), then one of its cards
  const reg = new Set((G().parties || []).map(p => p.slug)); const pool = reg.size && cards.some(c => reg.has(c.party)) ? cards.filter(c => reg.has(c.party)) : cards;
  const parties = [...new Set(pool.map(c => c.party))].sort(); const day = nzToday().iso;
  const party = parties[hashStr('potd-party:' + day) % parties.length];
  const mine = pool.filter(c => c.party === party).sort((a, b) => String(a.id).localeCompare(String(b.id)));
  return mine[hashStr('potd-card:' + day) % mine.length] }
function potdHTML() { const c = potdCard(); if (!c) return '';
  const st = lsJSON('potd'); const mine = st.date === nzToday().iso && st.id === c.id ? st.v : null;
  const label = { agree: 'You agreed', disagree: 'You disagreed', unsure: 'You weren’t sure' }[mine];
  return `<div class="feed__item" id="potd">
    <span class="feed__k">${ic('cards')} Policy of the day</span>
    <div class="potd">
      <p class="small muted">A real 2026 policy, party hidden. Everyone sees the same card today.</p>
      <p class="potd__s">${esc(c.statement)}</p>
      ${mine ? `<div class="reveal" style="--pc:${pcolor(c.party)}"><div class="reveal__who"><span class="sw"></span><span class="stack stack--s"><span class="micro muted">${esc(label)}. It’s from</span><span class="reveal__name">${esc(P(c.party).name || pname(c.party))}</span></span></div>
          ${c.why ? `<p class="small soft">${esc(c.why.length > 260 ? c.why.slice(0, 257).replace(/\s+\S*$/, '') + '…' : c.why)}</p>` : ''}
          <div class="row"><a class="more small" href="#/parties/${esc(c.party)}">About ${esc(pname(c.party))} ${ic('chev', 'i--xs')}</a>${c.doc ? `<span class="small"><button class="linkbtn" type="button" data-doc="${esc(c.party)}|${esc(c.doc)}">Read the full text</button></span>` : ''}<a class="more small" href="#/choose/swipe">Try more cards ${ic('chev', 'i--xs')}</a></div>
          <p class="micro muted">The party’s own policy, described neutrally. Your answer stays on this device.</p></div>`
      : `<div class="potd__actions" role="group" aria-label="Your view"><button class="btn btn--s" type="button" data-potd="disagree">${ic('x', 'i--xs')} Disagree</button><button class="btn btn--s btn--quiet" type="button" data-potd="unsure">Not sure</button><button class="btn btn--s btn--ink" type="button" data-potd="agree">${ic('check', 'i--xs')} Agree</button></div>`}
    </div></div>` }

function realPolls() { return (S.data.polls || []).filter(p => p && p.date && !/election result/i.test(p.pollster || '')) }
function sinceHTML() { const t = nzToday(); const out = [];
  const wk = new Date(Date.UTC(t.y, t.m - 1, t.d) - 7 * 864e5).toISOString().slice(0, 10);
  const nPolls = realPolls().filter(p => p.date >= wk && p.date <= t.iso).length;
  if (nPolls) out.push(`<a href="#/seats/polls"><b>${nPolls}</b><span>new poll${nPolls === 1 ? '' : 's'} in the last 7 days</span></a>`);
  if (S.news && S.news.items) { const y = new Date(Date.UTC(t.y, t.m - 1, t.d) - 864e5).toISOString().slice(0, 10);
    const nRel = S.news.items.filter(i => i.party !== 'government' && String(i.date).slice(0, 10) >= y).length;
    if (nRel) out.push(`<a href="#/parties/news"><b>${nRel}</b><span>party release${nRel === 1 ? '' : 's'} since yesterday</span></a>`) }
  if (!out.length) return '';
  return `<div class="feed__item"><span class="feed__k">${ic('spark')} New lately</span><div class="changes">${out.join('')}</div></div>` }

function pollWatchHTML() { const ps = realPolls(); if (!ps.length) return ''; const last = ps.map(p => p.date).sort().pop(); const latest = ps.filter(p => p.date === last);
  const who = latest.map(p => `${esc(p.pollster)}${p.sample_size ? ` (${Number(p.sample_size).toLocaleString('en-NZ')} people)` : ''}`);
  const list = who.length > 1 ? who.slice(0, -1).join(', ') + ' and ' + who[who.length - 1] : who[0];
  return `<div class="feed__item"><span class="feed__k">${ic('poll')} Poll watch</span>
    <p class="feed__t">${latest.length > 1 ? `${latest.length} polls` : 'The latest poll'} finished fieldwork on ${shortDate(last)}: ${list}.</p>
    <p class="src">${latest.map(p => p.source_url ? extA(p.source_url, esc(p.pollster)) : '').filter(Boolean).join(' · ')}</p>
    <a class="more small" href="#/seats/polls">What the polls would mean in seats ${ic('chev', 'i--xs')}</a></div>` }

function otdHTML() { const O = S.otd; if (!O || !O.days) return ''; const t = nzToday(); const list = (O.days[t.md] || []).filter(x => x && x.text && x.year && !x.upcoming);
  if (!list.length) return '';
  const person = slug => slug && (S.people || []).find(p => p.slug === slug);
  const item = x => { const pe = person(x.related && x.related.person); const pa = x.related && x.related.party && S.data.parties[x.related.party] ? x.related.party : null;
    return `<div class="otd"><span class="otd__year">${esc(x.year)}</span><div class="stack stack--s">${x.title ? `<b>${esc(x.title)}</b>` : ''}<p class="small soft">${esc(x.text)}</p>
      ${pe || pa ? `<p class="small">${pa ? `<a class="ptag ptag--s" style="--pc:${pcolor(pa)}" href="#/parties/${esc(pa)}"><span class="sw"></span>${esc(pname(pa))}</a>` : ''}${pe ? `${pa ? ' · ' : ''}<button class="linkbtn" type="button" data-person="${esc(pe.folder)}">${esc(pe.name)}</button>` : ''}</p>` : ''}

function fromPartiesHTML() { const N = S.news; if (!N || !N.items) return '';
  const all = (G().parties || []).map(p => p.slug).filter(s => N.parties[s] || N.follow_parties[s] || N.items.some(i => i.party === s));
  const slugs = all.sort((a, b) => pname(a).localeCompare(pname(b), 'en-NZ')); if (!slugs.length) return '';
  const k = slugs.length; const start = ((nzToday().n * 3) % k + k) % k; const pick = [0, 1, 2].slice(0, Math.min(3, k)).map(i => slugs[(start + i) % k]);
  const items = N.items.filter(i => i.party !== 'government').sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const tag = s => `<span class="ptag ptag--s" style="--pc:${pcolor(s)}"><span class="sw"></span>${esc(pname(s))}</span>`;
  const row = s => { const it = items.find(i => i.party === s); const pm = N.parties[s] || N.follow_parties[s] || {};

  return `<div class="feed__item"><span class="feed__k">${ic('news')} From the parties</span>

function resumeHTML() { const out = [];
  const Q = G().quiz2; const q = lsJSON('quiz2', typeof q2State === 'function' ? q2State : null); const qn = Object.keys(q.answers || {}).length; const qt = ((Q && Q.statements) || []).length || 30;

    out.push(`<a class="resume" href="#/vote"><span class="ring" style="--p:${Math.round(core / vt * 100)}"><span>${core}</span></span><span><b>Ready to vote</b><span class="small muted" style="display:block">${core} of ${vt} ticks done</span></span>${ic('chev')}</a>`) }
  if (!out.length) return '';
  return `<section class="stack" aria-labelledby="h-mine"><div class="shead shead--quiet"><div class="shead__row"><h2 id="h-mine" class="h3">Pick up where you left off</h2><span class="micro muted">Saved on this device only</span></div></div>

/* ----- the animated ballot illustration (shown in Vote › How MMP works) -----
   Rules: every registered party, alphabetical; ticks glide at random and never point at a choice; only the lists scroll,
   never the page; illustration only. */
function ballotParties() { const gp = (G().parties || []).map(p => ({ slug: p.slug, name: p.name || pname(p.slug) }));
  const list = gp.length ? gp : Object.keys(S.data.parties || {}).map(s => ({ slug: s, name: P(s).name || pname(s) }));
  return list.sort((a, b) => a.name.localeCompare(b.name, 'en-NZ')) }
function ballotHTML() { const bp = ballotParties();
  return `<figure class="ballot-fig stack stack--s">
    <div class="ballot" role="img" aria-label="Example ballot paper (illustration only; the ticks move at random and do not indicate a choice)">
      <div class="ballot__col"><span class="ballot__h">Party vote</span><div class="ballot__list" id="bl-p">${bp.map(p => `<span class="ballot__opt"><span class="ballot__name"><span class="sw" style="--pc:${pcolor(p.slug)}"></span>${esc(p.name)}</span><span class="ballot__box"></span></span>`).join('')}<span class="ballot__tick" id="bt-p">${TICK_SVG(true)}</span></div></div>
      <div class="ballot__col"><span class="ballot__h">Electorate vote</span><div class="ballot__list" id="bl-e">${['Candidate A', 'Candidate B', 'Candidate C', 'Candidate D', 'Candidate E', 'Candidate F'].map(c => `<span class="ballot__opt"><span class="ballot__name">${c}</span><span class="ballot__box"></span></span>`).join('')}<span class="ballot__tick" id="bt-e">${TICK_SVG(true)}</span></div></div>
    </div>
    <figcaption class="small muted">Illustration only: the ticks move at random and don’t show a choice. All ${bp.length} registered parties appear on the real paper, in alphabetical order, and candidates are listed alphabetically by surname. You can split your two votes between different parties. What the real paper looks like: ${extA('https://vote.nz/2026-general-election/voting-in-the-election/what-to-do', 'vote.nz')}.</figcaption>
  </figure>` }
function startBallot() { if (S.ballotTimer) clearInterval(S.ballotTimer); if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = [['#bl-p', '#bt-p'], ['#bl-e', '#bt-e']].map(([l, t]) => ({ list: $(l), tick: $(t), i: 0 })).filter(c => c.list && c.tick);
  if (!cols.length) return; cols[1] && (cols[1].i = 2);
  const place = c => { const rows = c.list.querySelectorAll('.ballot__opt'); if (!rows.length) return; const r = rows[c.i % rows.length];
    c.tick.style.top = (r.offsetTop + (r.offsetHeight - 22) / 2) + 'px'; c.tick.classList.add('on');
    // scroll only the list, never the page
    const top = r.offsetTop - c.list.clientHeight / 2 + r.offsetHeight / 2; c.list.scrollTo({ top: Math.max(0, top), behavior: 'smooth' }) };
  cols.forEach(place);
  S.ballotTimer = setInterval(() => { if (!document.body.contains(cols[0].list)) { clearInterval(S.ballotTimer); S.ballotTimer = null; return }
    cols.forEach(c => { const n = c.list.querySelectorAll('.ballot__opt').length; if (n < 2) return; let j; do { j = Math.floor(Math.random() * n) } while (j === c.i); c.i = j; place(c) }) }, 1700) }

  return secs.filter(sec => extra.includes(sec.id) || (re && (sec.who_its_for || []).some(w => re.test(w)))) }

function voteReady(root) {

      <span class="check__t">${esc(c.step)}${i === 1 && ph === 'enrol' ? ` <span class="deadline">${toE > 1 ? `${toE} days left` : toE === 1 ? '1 day left' : 'Closes tonight'}</span>` : ''}</span>

      ${(sec.notes || []).length ? `<ul class="small muted vnotes">${sec.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}</div></details>`;
  const personaHTML = () => { const shown = sitSections(secs, sit);

  const kd = (H.key_dates || []).filter(d => d.date >= nzToday().iso).slice(0, 6);

      <section class="stack stack--s" aria-labelledby="h-help"><div class="shead shead--quiet"><h2 id="h-help" class="h4">Need a hand?</h2></div>
        <dl class="dl vhelp">${contacts.map(([k, v]) => `<dt>${esc(k.replace(/_/g, ' ').replace(/^\w/, c => c.toUpperCase()))}</dt><dd>${esc(v)}</dd>`).join('')}</dl></section>

    ${voteFoot()}`;
  root.querySelectorAll('[data-ck]').forEach(c => c.onchange = () => { st[c.dataset.ck] = c.checked; store.set('votecheck', JSON.stringify(st)); c.closest('.check').classList.toggle('is-done', c.checked); $('#vprog').innerHTML = progress() });

/* ----- Make a plan: when, where, with whom → .ics + message ----- */
const PLAN_SLOTS = [['morning', 'Morning', 9, 11], ['midday', 'Midday', 11, 13], ['afternoon', 'Afternoon', 13, 16], ['late', 'After 4', 16, 18]];
function planDays() { const t = nzToday(); const out = [];
  for (let d = 26; d <= 38; d++) { const dt = new Date(Date.UTC(2026, 9, d)); const iso = dt.toISOString().slice(0, 10); if (iso < t.iso) continue;
    const eday = iso === '2026-11-07'; out.push({ iso, eday, label: dt.toLocaleDateString('en-NZ', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }) }) }
  return out }
function planText(p, days) { const d = days.find(x => x.iso === p.day); const s = PLAN_SLOTS.find(x => x[0] === p.slot); if (!d || !s) return '';
  const hr = h => (h > 12 ? h - 12 : h) + (h >= 12 ? 'pm' : 'am');
  return `My voting plan: ${d.eday ? 'election day, ' : ''}${d.label}, ${s[1].toLowerCase()} (${hr(s[2])}–${hr(s[3])})${p.where ? `, at ${p.where}` : ''}${p.withWho ? `, with ${p.withWho}` : ''}. Find a voting place and its hours: https://map.vote.nz` }
function planICS(p, days) { const d = days.find(x => x.iso === p.day); const s = PLAN_SLOTS.find(x => x[0] === p.slot); if (!d || !s) return null;
  const [y, m, dd] = d.iso.split('-').map(Number); const stamp = h => new Date(Date.UTC(y, m - 1, dd, h - 13)).toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');   // NZDT is UTC+13 for the whole voting period
  const escI = v => String(v).replace(/[\\;,]/g, c => '\\' + c).replace(/\n/g, '\\n');
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Ballot Book NZ//Voting plan//EN', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
    `UID:voteplan-${d.iso}-${s[0]}@ballotbook.nz`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z')}`, `DTSTART:${stamp(s[2])}`, `DTEND:${stamp(s[2] + 1)}`,
    `SUMMARY:${escI('Go and vote' + (p.withWho ? ' with ' + p.withWho : ''))}`, `LOCATION:${escI(p.where || 'Any voting place (map.vote.nz)')}`,
    `DESCRIPTION:${escI(planText(p, days) + '\nNo ID needed. Official information: vote.nz or 0800 36 76 56.')}`, 'URL:https://map.vote.nz',
    'BEGIN:VALARM', 'TRIGGER:-PT1H', 'ACTION:DISPLAY', 'DESCRIPTION:Voting today', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n') }
function votePlan(root) {
  const ph = electionPhase(); const days = planDays();
  let p; try { p = JSON.parse(store.get('voteplan') || '{}') || {} } catch { p = {} }
  if (!days.some(d => d.iso === p.day)) p.day = (days.find(d => d.eday) || days[0] || {}).iso;
  if (!PLAN_SLOTS.some(s => s[0] === p.slot)) p.slot = 'morning';
  const closed = ph === 'results' || ph === 'after' || !days.length;
  const save = () => store.set('voteplan', JSON.stringify(p));
  const draw = () => { const txt = planText(p, days);
    root.innerHTML = `${voteHead('Make a plan', 'Make a voting plan.', 'People who decide when and where they’ll vote are more likely to follow through. Your plan becomes a calendar event or a message. Nothing is sent to us; it’s saved on this device.')}
      ${closed ? `<div class="callout callout--signal"><p><b>Voting has closed for 2026.</b> There’s nothing left to plan; see <a href="#/vote/specials">what special votes could change</a>.</p></div>` : `
      <div class="split split--7-5">
        <div class="plan">
          <div class="row row--between"><b>My voting plan</b><span class="micro muted">Saved on this device</span></div>
          <div class="plan__q" style="margin-top:14px"><span id="pq-day">When</span><div class="chips chips--scroll" role="group" aria-labelledby="pq-day">${days.map(d => `<button class="chip" type="button" data-day="${d.iso}" aria-pressed="${d.iso === p.day}">${esc(d.label)}${d.eday ? ' · election day' : ''}</button>`).join('')}</div>
            <div class="chips" role="group" aria-label="Time of day">${PLAN_SLOTS.map(([k, l, a, b]) => `<button class="chip" type="button" data-slot="${k}" aria-pressed="${k === p.slot}">${l} <span class="micro muted">${a > 12 ? a - 12 : a}–${b > 12 ? b - 12 : b}${b >= 12 ? 'pm' : 'am'}</span></button>`).join('')}</div>
            <p class="micro muted">${(days.find(d => d.iso === p.day) || {}).eday ? 'Election day: every voting place is open 9am–7pm.' : 'Advance voting hours differ from place to place; check yours on map.vote.nz.'}</p></div>
          <div class="plan__q"><label for="pq-where"><span class="plan__lbl">Where</span></label><input class="input" id="pq-where" type="text" maxlength="80" autocomplete="off" placeholder="e.g. the library on the main street" value="${esc(p.where || '')}">
            <a class="more small" href="https://map.vote.nz" target="_blank" rel="noopener">Find voting places near you on map.vote.nz ${ic('ext', 'i--xs ext')}</a></div>
          <div class="plan__q"><label for="pq-who"><span class="plan__lbl">Who with</span></label><input class="input" id="pq-who" type="text" maxlength="60" autocomplete="off" placeholder="On my own, or a name" value="${esc(p.withWho || '')}"></div>
          <div class="row"><button class="btn btn--primary" type="button" id="pl-ics">${ic('caladd', 'i--s')} Add to calendar</button><a class="btn" id="pl-sms" href="sms:?&body=${encodeURIComponent(txt)}">${ic('msg', 'i--s')} Text it</a><a class="btn btn--quiet" id="pl-wa" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">WhatsApp</a><button class="btn btn--quiet" type="button" id="pl-copy">${ic('share', 'i--s')} Copy</button></div>
          <p class="small soft" id="pl-text" aria-live="polite">${esc(txt)}</p>
        </div>
        <div class="stack"><p class="lede">Three choices: a day, a time and a place. Going with someone helps too.</p>
          <p class="small muted">You can vote at any voting place in New Zealand. No ID needed; your EasyVote card makes it quicker if you have it.</p></div>
      </div>`}
      ${voteFoot()}`;
    if (closed) return;
    const on = root.querySelector('[data-day][aria-pressed="true"]'); if (on) { const row = on.parentElement; row.scrollLeft = Math.max(0, on.offsetLeft - row.offsetLeft - 8) }
    root.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { p.day = b.dataset.day; save(); draw(); const n = root.querySelector(`[data-day="${p.day}"]`); if (n) n.focus({ preventScroll: true }) });
    root.querySelectorAll('[data-slot]').forEach(b => b.onclick = () => { p.slot = b.dataset.slot; save(); draw(); const n = root.querySelector(`[data-slot="${p.slot}"]`); if (n) n.focus({ preventScroll: true }) });
    const upd = () => { const t = planText(p, days); $('#pl-text').textContent = t; $('#pl-sms').href = 'sms:?&body=' + encodeURIComponent(t); $('#pl-wa').href = 'https://wa.me/?text=' + encodeURIComponent(t) };
    $('#pq-where').oninput = e => { p.where = e.target.value.trim(); save(); upd() };
    $('#pq-who').oninput = e => { p.withWho = e.target.value.trim(); save(); upd() };
    $('#pl-ics').onclick = () => { const ics = planICS(p, days); if (!ics) return; const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
      const a = document.createElement('a'); a.href = url; a.download = 'voting-plan.ics'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000) };
    $('#pl-copy').onclick = async () => { const t = planText(p, days); let ok = false; try { await navigator.clipboard.writeText(t); ok = true } catch {}
      const b = $('#pl-copy'); b.innerHTML = `${ic('check', 'i--s')} ${ok ? 'Copied' : 'Select the text below'}`; setTimeout(() => { if (document.body.contains(b)) b.innerHTML = `${ic('share', 'i--s')} Copy` }, 2200) } };
  draw();
}

/* ----- How MMP works ----- */
function voteMMP(root) {
  root.innerHTML = `${voteHead('How MMP works', 'Two ticks, one Parliament.', 'New Zealand has used MMP (mixed-member proportional representation) since 1996. Here is the whole system in four ideas.')}
    <section class="stack" aria-labelledby="h-2v"><div class="shead"><h2 id="h-2v">You have two votes</h2></div>${twoVotesHTML()}</section>
    <div class="cols cols--2">
      <section class="stack stack--s" aria-labelledby="h-5"><div class="shead shead--quiet"><h2 id="h-5" class="h3">The 5% rule</h2></div>
        <p class="soft">A party gets its share of the 120 seats only if it wins at least 5% of the party vote, or wins at least one electorate. Party votes for parties that do neither don’t count towards any seats.</p></section>
      <section class="stack stack--s" aria-labelledby="h-61"><div class="shead shead--quiet"><h2 id="h-61" class="h3">61 to govern</h2></div>
        <p class="soft">A government needs the support of a majority of MPs: usually 61 of 120, more if there is an overhang. One party rarely gets there alone, so parties form coalitions or support agreements.</p></section>
      <section class="stack stack--s" aria-labelledby="h-fill"><div class="shead shead--quiet"><h2 id="h-fill" class="h3">How the seats are filled</h2></div>
        <p class="soft">Every electorate winner gets a seat. Each party’s remaining seats are filled from its ranked party list, so its total matches its share of the party vote (worked out with the Sainte-Laguë formula).</p></section>
      <section class="stack stack--s" aria-labelledby="h-oh"><div class="shead shead--quiet"><h2 id="h-oh" class="h3">Overhang</h2></div>
        <p class="soft">If a party wins more electorates than its party vote entitles it to, it keeps them, and Parliament has a few more than 120 seats until the next election.</p></section>
    </div>
    <section class="stack" aria-labelledby="h-bal"><div class="shead"><div class="shead__row"><h2 id="h-bal">The ballot paper</h2><span class="micro muted">Illustration only</span></div></div>
      <div class="split split--7-5">${ballotHTML()}
        <div class="stack"><p class="soft">Party vote on the left, electorate vote on the right. Tick one circle on each side, or only one side if you prefer. Made a mistake? Ask for a new paper.</p>
          <div class="rows">${rowlink('#/seats/calculator', 'scale', 'Try the seat calculator', 'Turn party-vote shares into seats.')}${rowlink('#/seats/coalition', 'users', 'Coalition builder', 'Add parties up to 61.')}${rowlink('#/vote/glossary', 'book', 'Glossary', 'Every MMP term in plain English.')}</div></div>
      </div></section>
    ${voteFoot()}`;
  requestAnimationFrame(startBallot);
}

/* ----- Glossary (plain English, neutral, no party names) ----- */
const GLOSSARY = [
  ['Advance voting', 'Voting before election day, at any voting place in the country. In 2026 it runs from Monday 26 October to Friday 6 November.'],
  ['Ballot paper', 'The single sheet you vote on: parties on the left for your party vote, candidates for your electorate on the right. Parties are listed alphabetically, and candidates alphabetically by surname.'],
  ['Coalition', 'An agreement between two or more parties to govern together, usually sharing ministerial jobs and an agreed programme.'],
  ['Confidence and supply', 'A deal where a party promises to support the government on confidence votes and on budgets (supply) without fully joining it. It may still hold some ministerial roles.'],
  ['Dormant roll', 'The list of people who have been taken off the main roll, usually because mail to them was returned. People on it can still vote by casting a special vote.'],
  ['EasyVote card', 'A card the Electoral Commission sends to enrolled voters. Bringing it (on paper or your phone) makes finding you on the roll faster, but it is not required.'],
  ['Electoral Commission', 'The independent Crown entity that runs New Zealand elections. Its official information is at vote.nz and 0800 36 76 56.'],
  ['Electorate', 'A geographic area that elects one MP. In 2026 there are 71: 64 general electorates and 7 Māori electorates.'],
  ['Electorate vote', 'Your tick on the right-hand side of the ballot paper. It chooses the MP for your area; the candidate with the most votes wins.'],
  ['Enrolment', 'Being on the electoral roll, which you must be to vote. In 2026 enrolment closes at midnight on Sunday 25 October, and you can’t enrol at a voting place.'],
  ['Informal vote', 'A vote where the counters can’t tell what the voter intended. It is recorded but not counted for anyone.'],
  ['List MP', 'An MP who gets a seat from their party’s ranked list rather than by winning an electorate. List seats top each party up to its share of the party vote.'],
  ['Majority', 'More than half the seats in Parliament: usually 61 of 120. In an electorate, the majority is the number of votes between the winner and the runner-up.'],
  ['Māori roll', 'People of Māori descent can choose to be on the Māori roll or the general roll. It decides which electorate you vote in; your party vote is the same either way.'],
  ['MMP', 'Mixed-member proportional representation, New Zealand’s voting system since 1996. You get two votes, and the party vote decides how many seats each party gets.'],
  ['Official result', 'The final count, including special votes, after every vote has been checked and recounted by hand. For 2026 it is due on Friday 27 November.'],
  ['Overhang', 'When a party wins more electorates than its party vote entitles it to. It keeps those seats, so Parliament has more than 120 MPs until the next election.'],
  ['Party list', 'The ranked list of candidates each party publishes. List seats are filled from the top, skipping anyone who has already won an electorate.'],
  ['Party vote', 'Your tick on the left-hand side of the ballot paper. It decides how many of the 120 seats each party gets overall.'],
  ['Preliminary result', 'The count released on election night. It leaves out special votes and can change before the official result.'],
  ['Recount', 'A fresh count that a candidate or party can ask a District Court judge for within three working days of the official result.'],
  ['Sainte-Laguë formula', 'The arithmetic used to share the seats out in proportion to the party vote among parties that pass the threshold or win an electorate.'],
  ['Special vote', 'A normal vote plus a signed declaration, used when you aren’t on the printed roll where you vote: for example if you enrolled after Writ Day, are voting outside your electorate, are overseas or are on the unpublished roll. Special votes are counted in the official result.'],
  ['Spoilt paper', 'A ballot paper you have made a mistake on. Hand it back and ask for a new one; spoilt papers are not counted.'],
  ['Threshold', 'The 5% of the party vote a party needs, unless it wins an electorate, to get list seats in proportion to its party vote.'],
  ['Unpublished roll', 'A confidential part of the roll for people whose safety could be at risk if their name and address were public. They vote with a special vote.'],
  ['Wasted vote', 'A party vote for a party that neither reaches 5% nor wins an electorate. It doesn’t count towards any party’s seats.'],
  ['Writ Day', 'The day the election is formally called. In 2026 it was 4 October; people who enrol or update their details after it cast a special vote.']];
function voteGlossary(root) {
  const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const items = GLOSSARY.slice().sort((a, b) => a[0].localeCompare(b[0], 'en-NZ'));
  root.innerHTML = `${voteHead('Glossary', 'MMP words, in plain English.', `${items.length} terms you’ll meet in election coverage, each in a sentence or two. For anything official, check vote.nz.`)}
    <div class="input-icon gloss__find">${ic('search', 'i--s')}<input class="input" type="search" id="gl-q" placeholder="Filter the terms" aria-label="Filter the glossary" autocomplete="off"></div>
    <dl class="gloss" id="gl-list">${items.map(([t, d]) => `<div class="gloss__row" id="g-${slug(t)}" data-t="${esc((t + ' ' + d).toLowerCase())}"><dt>${esc(t)}</dt><dd>${esc(d)}</dd></div>`).join('')}</dl>
    <p class="small muted" id="gl-none" hidden>No term matches. Try a shorter word.</p>
    ${voteFoot()}`;
  $('#gl-q').oninput = e => { const q = e.target.value.trim().toLowerCase(); let n = 0;
    root.querySelectorAll('.gloss__row').forEach(r => { const on = !q || r.dataset.t.includes(q); r.hidden = !on; if (on) n++ }); $('#gl-none').hidden = n > 0 };
}

/* ----- What special votes could change ----- */
function voteSpecials(root) {
  const H = G().howtovote || {}; const secs = H.sections || [];
  const sv = secs.find(s => s.id === 'special-votes'); const af = secs.find(s => s.id === 'after');
  const pick = (sec, re) => ((sec && sec.steps) || []).filter(x => re.test(x.text));
  const what = pick(sv, /special vote is|how special votes are counted|another electorate/i);
  const changed = pick(af, /special votes have changed|^2020:|not final|official results:/i);
  const step = x => `<li><p>${esc(x.text)}</p>${x.url ? `<p class="src">${ic('doc')} ${extA(x.url, esc((x.source || x.url.replace(/^https?:\/\//, '').split('/')[0]).split(',')[0]))}</p>` : ''}</li>`;
  const notes = [].concat((sv && sv.notes) || [], (af && af.notes) || []).filter(n => /special/i.test(n));
  root.innerHTML = `${voteHead('Special votes', 'What special votes could change.', 'The result on election night is not the final result. Special votes are counted over the following three weeks; in 2023 they were about one vote in five, and they can move seats.')}
    <div class="split split--7-5">
      <div class="stack stack--l">
        <section class="stack stack--s" aria-labelledby="h-sv1"><div class="shead"><h2 id="h-sv1">What a special vote is</h2></div>
          <p class="soft">A special vote is an ordinary vote with a signed declaration attached. People cast one when they aren’t on the printed roll where they vote, for example because they enrolled late, voted outside their electorate or voted from overseas. Each declaration is checked before the vote is counted.</p>
          ${what.length ? `<ol class="vsteps">${what.map(step).join('')}</ol>` : ''}</section>
        <section class="stack stack--s" aria-labelledby="h-sv2"><div class="shead"><h2 id="h-sv2">What they have changed before</h2></div>
          <p class="soft">Because special votes are counted last, the official result can differ from election night: a party can gain or lose a seat or two, close electorates can change hands, and the numbers a government needs can shift.</p>
          ${changed.length ? `<ol class="vsteps">${changed.map(step).join('')}</ol>` : ''}</section>
      </div>
      <aside class="stack sticky">
        <div class="panel"><h2 class="h3">Dates</h2><dl class="dl"><dt>Election night</dt><dd>Sat 7 Nov, from 7pm: preliminary results</dd><dt>Specials arrive</dt><dd>Up to 10 days after election day</dd><dt>Official result</dt><dd>Fri 27 Nov 2026</dd></dl>
          ${vExt('https://electionresults.govt.nz', 'Official results site', 'btn btn--s')}</div>
        ${notes.length ? `<div class="stack stack--s">${notes.map(n => `<p class="small muted">${esc(n)}</p>`).join('')}</div>` : ''}
        <div class="rows">${rowlink('#/vote/glossary', 'book', 'Glossary', 'Preliminary, official, special and more.')}${rowlink('#/vote/mmp', 'scale', 'How MMP works', 'Why a few votes can move a seat.')}</div>
      </aside>
    </div>
    ${H.as_of ? `<p class="src">${ic('shield')} Checked ${esc(H.as_of)} against vote.nz and elections.nz.</p>` : ''}
    ${voteFoot()}`;
}

/* ===== Vote › Your electorate: finder → found → candidates in ballot order → 2023 result → history ===== */
const elSlug = n => String(n || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/^mount-|^mount /, 'mt-').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').replace(/^mount-/, 'mt-').replace(/-electorate$/, '');
const ELEC_CONSENT = 'Your browser will ask for permission. Your location is checked against the electorate map on this device only; it is not stored or sent anywhere. You can also just choose your electorate from the list.';
// Ballot order: A–Z by surname (last word, keeping lower-case particles such as "van"), then given names
function surnameKey(name) { const w = String(name || '').trim().split(/\s+/); let i = w.length - 1; while (i > 0 && /^(van|von|de|da|di|du|le|la|te|der|den)$/.test(w[i - 1])) i--;
  return (w.slice(i).join(' ') + ' ' + w.slice(0, i).join(' ')).replace(/^(van|von|de|da|di|du|le|la|te|der|den)\s+/i, '') }
const ballotSort = (a, b) => surnameKey(a.name).localeCompare(surnameKey(b.name), 'en-NZ', { sensitivity: 'base' });
const elInitials = n => String(n || '?').replace(/[^A-Za-zĀ-ūÀ-ÿ' -]/g, '').split(/\s+/).filter(Boolean).map(w => w[0]).filter((_, i, a) => i === 0 || i === a.length - 1).join('').toUpperCase();
function elList() { return (S.data.electorates || []).slice().sort((a, b) => a.name.localeCompare(b.name, 'en-NZ')) }
function featToElectorate(f) { if (!f) return null; const E = S.data.electorates || []; const s = f.properties && (f.properties.slug || elSlug(f.properties.name));
  return E.find(x => elSlug(x.slug) === s || elSlug(x.name) === s) || null }

function candFace(c) { const img = S.thumbs && S.thumbs[c.folder]; const pc = pcolor(c.party);
  return img ? `<img class="face" style="--pc:${pc}" loading="lazy" src="${img}" alt="" width="56" height="56">` : `<span class="face face--none" style="--pc:${pc}" aria-hidden="true">${esc(elInitials(c.name))}</span>` }
function candRow(c) { const p = findPerson(c.slug, c.name) || {}; const mp = !!c.sitting_mp;
  return `<li><button class="cand" type="button" data-cand="${esc(c.slug || '')}" data-cname="${esc(c.name)}">${candFace(c)}<span><span class="cand__name">${esc(c.name)}</span>
    <span class="cand__meta"><span class="ptag ptag--s" style="--pc:${pcolor(c.party)}"><span class="sw"></span>${esc(S.data.parties[c.party] ? pname(c.party) : (c.party_name || pname(c.party)))}</span>${mp ? '<span class="badge badge--ink">Sitting MP</span>' : ''}<span>${c.list_rank_2026 ? `List #${c.list_rank_2026}` : 'Electorate only'}</span></span></span>${ic('chev')}</button></li>` }

// winners of this seat (or the seat(s) it replaced) at each election since 2011
function elHistory(e) { const names = new Set([e.name, ...(e.predecessor_seats || [])].map(elSlug)); const out = [];
  for (const el of (S.data.elections || []).filter(x => x.year >= 2011).sort((a, b) => a.year - b.year)) {
    const hits = (el.electorates || []).filter(r => names.has(elSlug(r.name)));
    const r = hits.find(h => elSlug(h.name) === elSlug(e.name)) || hits[0]; if (r) out.push({ year: el.year, r, other: hits.length > 1 }) }
  return out }

function electorateBody(e) { const r = e.result_2023 || {}; const eday = isElectionDay(); const maori = e.type === 'maori';
  const cands = (e.candidates || []).slice().sort(ballotSort);
  const loc = S.locHit || {}; const here = featToElectorate(maori ? loc.maori : loc.general); const alt = here && here.slug === e.slug ? featToElectorate(maori ? loc.general : loc.maori) : null;
  const altLine = maori ? `This is one of the seven Māori electorates: you vote here if you’re on the Māori roll.${alt ? ` On the general roll, your electorate is <b>${esc(alt.name)}</b> (<a href="#/vote/electorate/${esc(alt.slug)}">see it</a>).` : ''}`
    : `On the Māori roll? ${alt ? `Your electorate is <b>${esc(alt.name)}</b>. <a href="#/vote/electorate/${esc(alt.slug)}">See its candidates</a>.` : 'Your Māori electorate depends on where you live; use your location above, or check at vote.nz.'} <a href="https://vote.nz" target="_blank" rel="noopener">Not sure which roll you’re on?</a>`;
  // 2023 result: top two and the margin
  const rc = (r.candidates || []).slice().sort((a, b) => (b.votes || 0) - (a.votes || 0)); const top2 = rc.slice(0, 2); const maxPct = Math.max(1, ...top2.map(c => c.pct || 0));
  let rank = ''; if (!eday && r.majority && !r.for_predecessor_seat) { const all = ((S.data.elections || []).find(x => x.year === 2023) || {}).electorates || [];
    const ms = all.map(x => x.majority).filter(m => typeof m === 'number').sort((a, b) => a - b); const i = ms.indexOf(r.majority);
    if (i === 0) rank = 'the closest seat in the country in 2023'; else if (i > 0 && i < 10) rank = `the ${ordinal(i + 1)} closest of ${ms.length} seats in 2023` }
  const pred = r.for_predecessor_seat || (e.predecessor_seats || []).some(x => x !== e.name);
  const pv = Object.entries(r.party_vote_pct || {}).sort((a, b) => pname(a[0]).localeCompare(pname(b[0]), 'en-NZ'));
  const hist = elHistory(e);
  return `<div class="found">
      <p class="eyebrow">${maori ? 'Māori electorate' : 'General electorate'}${e.region ? ' · ' + esc(e.region) : ''}</p>
      <h2>${esc(e.name)}</h2>
      ${e.boundary_status && /new|renamed|redrawn/i.test(e.boundary_status) ? `<p class="small muted">${esc(e.boundary_status)}</p>` : ''}
      <p class="found__alt">${altLine}</p>
    </div>
    <div class="split split--7-5">
      <div class="stack">
        <div class="shead__row"><h3>On your ballot: ${cands.length} candidate${cands.length === 1 ? '' : 's'}</h3><span class="micro muted">Ballot order (A–Z by surname)</span></div>
        ${cands.length ? `<ul class="cands" role="list">${cands.map(candRow).join('')}</ul>` : '<p class="small muted">The candidate list for this electorate is still being checked.</p>'}
        <div class="row el-actions"><a class="btn" href="https://map.vote.nz" target="_blank" rel="noopener">${ic('pin', 'i--s')} Voting places near ${esc(e.name)} ${ic('ext', 'i--xs ext')}</a><button class="btn btn--quiet" type="button" id="el-print">${ic('print', 'i--s')} Print a one-pager</button>${cands.length > 1 ? `<button class="btn btn--quiet" type="button" id="el-compare">${ic('swap', 'i--s')} Compare candidates</button>` : ''}</div>
        <p class="micro muted">Candidates from policy.nz and party lists; the official list is on your EasyVote card and at vote.nz. You also have a party vote, for any party, wherever you live.</p>
      </div>
      <div class="stack stack--l">
        ${r.winner ? `<div class="panel">
          <p class="eyebrow">2023 result${pred ? ` · ${esc(r.seat || (e.predecessor_seats || []).join(', '))}` : ''}</p>
          ${r.majority ? `<div class="margin"><span class="figure">${Number(r.majority).toLocaleString('en-NZ')}</span><span><b>votes</b> between first and second${rank ? `<br>${rank}` : ''}</span></div>` : ''}
          ${top2.length ? `<div class="duel">${top2.map((c, i) => `<div class="duel__row" style="--pc:${pcolor(c.party)}"><span class="duel__name">${esc(c.name)} <span class="muted small" style="font-weight:500">${esc(pname(c.party))}</span></span><span class="duel__v">${fmt(c.pct, 1)}%</span><div class="bar"><i style="--w:${(c.pct || 0) / maxPct * 90}%;--i:${i}"></i></div></div>`).join('')}</div>` : `<p class="small">${esc(r.winner)} (${esc(pname(r.party))}) won.</p>`}
          ${pred ? `<p class="micro muted">Based on ${esc((e.predecessor_seats || []).join(', ') || r.seat || '')} before the 2025 boundary changes, so the 2026 contest is not directly comparable.</p>` : ''}
          ${pv.length ? `<details class="disclose"><summary>Party vote in this area, 2023</summary><div class="disclose__body"><p class="micro muted">A–Z. ${esc(r.party_vote_basis || 'Official count')}.</p>${pv.map(([p, v], i) => `<div class="rrow" style="--pc:${pcolor(p)}"><span>${esc(pname(p))}</span><div class="bar"><i style="--w:${Math.min(100, v * 2)}%;--i:${i}"></i></div><span class="rrow__v">${fmt(v)}%</span></div>`).join('')}</div></details>` : ''}
          <p class="src">${ic('doc')} ${r.source ? extA(r.source, 'Official count, as reported') : 'Official count, Electoral Commission'} · <a href="#/seats/map/2023/${esc(e.slug)}">See ${esc(e.name)} on the map since 2011</a></p>
        </div>` : ''}
      </div>
    </div>
    <div class="cols cols--2 el-more">
      <div class="stack stack--l">
        ${hist.length ? `<section class="stack stack--s" aria-labelledby="h-hist"><h3 id="h-hist" class="h4">Who won here</h3>
          <div class="history">${hist.map(h => `<div style="--pc:${pcolor(h.r.party)}"${h.year === 2023 ? ' aria-current="true"' : ''}><i></i><span>${h.year}</span><span>${esc(pname(h.r.party))}</span></div>`).join('')}</div>
          <p class="micro muted">${hist.map(h => `${h.year}: ${esc(h.r.winner)}${h.r.majority ? ` by ${Number(h.r.majority).toLocaleString('en-NZ')}` : ''}${elSlug(h.r.name) !== elSlug(e.name) ? ` (${esc(h.r.name)})` : ''}`).join(' · ')}.</p></section>` : ''}
        ${e.sitting_mp ? `<p class="small"><b>Current MP:</b> ${esc(e.sitting_mp.name)} (${esc(pname(e.sitting_mp.party))})${e.mp_standing_again === false ? ', not standing again' : ''}.</p>` : ''}
      </div>
      <div class="stack stack--l">

      </div>
    </div>` }

function compareCands(e) { const cands = (e.candidates || []).slice().sort(ballotSort);

    return `<tr><td><b>${esc(c.name)}</b></td><td><span class="sw" style="--pc:${pcolor(c.party)}"></span> ${esc(S.data.parties[c.party] ? pname(c.party) : (c.party_name || pname(c.party)))}</td><td class="n">${c.list_rank_2026 ? '#' + c.list_rank_2026 : 'Electorate only'}</td><td>${c.sitting_mp ? 'Sitting MP' : (p.parliaments || []).length ? 'Former MP' : 'No'}</td><td style="white-space:normal;min-width:12rem">${esc(p.before || '–')}</td></tr>` }).join('');
  openSheet({ title: `${e.name}: the candidates side by side`, depth: ['Electorate', 'Candidates', 'Compare'], at: 2, src: 'Ballot order (A–Z by surname). From policy.nz, party lists and the candidates’ own profiles.',

function pickerSheet(cur) { const E = elList(); const grp = t => E.filter(e => (e.type || 'general') === t);

      <div class="rows">${L.map(e => `<a class="rowlink rowlink--plain" href="#/vote/electorate/${esc(e.slug)}"><span><span class="rowlink__title">${esc(e.name)}</span><span class="rowlink__sub" style="display:block">${esc(e.region || '')}${e.region ? ' · ' : ''}${(e.candidates || []).length} candidates</span></span>${ic('chev')}</a>`).join('')}</div></section>` }).join('') }

V.electorate = async slug => {

    </div>`;

  q.oninput = () => { const v = q.value.trim().toLowerCase(); if (v.length < 2) { sg.hidden = true; sg.innerHTML = ''; return }
    const byName = E.filter(e => e.name.toLowerCase().includes(v) || elSlug(e.name).includes(elSlug(v)));
    const byText = byName.length && v.length < 6 ? [] : E.filter(e => !byName.includes(e) && ((e.region || '').toLowerCase().includes(v) || (v.length >= 4 && (e.description || '').toLowerCase().includes(v)))).slice(0, 6);
    const row = (e, why) => `<a class="rowlink rowlink--plain" href="#/vote/electorate/${esc(e.slug)}"><span><span class="rowlink__title">${esc(e.name)}</span><span class="rowlink__sub" style="display:block">${why}</span></span>${ic('chev')}</a>`;
    sg.innerHTML = byName.slice(0, 8).map(e => row(e, `${e.type === 'maori' ? 'Māori' : 'General'} electorate · ${(e.candidates || []).length} candidates`)).join('')
      + (byText.length ? `<p class="micro muted el-sugg__h">Mentions “${esc(q.value.trim())}”: boundaries can split a town, so check at vote.nz</p>` + byText.map(e => row(e, esc(e.region || 'Mentioned in its description'))).join('') : '')
      || `<p class="small muted el-sugg__h">No electorate matches. Try the list, or look up your address at vote.nz.</p>`;
    sg.hidden = false };
  q.onkeydown = e => { if (e.key === 'Enter') { const a = sg.querySelector('a'); if (a) { e.preventDefault(); go(a.getAttribute('href')) } } };
  $('#el-all').onclick = () => pickerSheet(sel && sel.slug);
  // location (device-side only; uses the shared locateElectorate())
  $('#el-loc').onclick = async () => { const out = $('#el-loc-out'); out.innerHTML = '<p class="small muted">Finding your electorate…</p>';
    try { const r = await locateElectorate(); if (!r.general && !r.maori) { out.innerHTML = '<p class="small">That location is outside New Zealand’s electorates. Choose from the list instead.</p>'; return }
      S.locHit = { general: r.general || null, maori: r.maori || null, accuracy: r.accuracy };
      const g = featToElectorate(r.general), m = featToElectorate(r.maori);
      const warn = r.accuracy > 2000 ? `<p class="micro muted">Location accuracy is about ${Math.round(r.accuracy / 1000)} km, so near a boundary the result may be wrong; check your address at vote.nz.</p>` : '';
      if (g) { if (warn) S.locWarn = warn; go('#/vote/electorate/' + g.slug); return }
      out.innerHTML = `<p class="small">You’re in the <b>${esc(r.general ? r.general.properties.name : '–')}</b> general electorate${r.maori ? ` and the <b>${esc(r.maori.properties.name)}</b> Māori electorate` : ''}.</p>${m ? `<a class="btn btn--s" href="#/vote/electorate/${esc(m.slug)}">${esc(m.name)}</a>` : ''}${warn}` }
    catch (err) { out.innerHTML = `<p class="small">Couldn’t get your location (${esc(err && err.message || 'permission denied')}). Pick your electorate from the list instead, or look up your address at vote.nz.</p>` } };
  if (S.locWarn && sel) { $('#el-loc-out').innerHTML = S.locWarn; const d = $('.el-find'); if (d) d.open = true; S.locWarn = null }
  if (!sel) return;
  const body = $('#el-body');
  body.addEventListener('click', ev => { const b = ev.target.closest('[data-cand]'); if (!b) return; const p = findPerson(b.dataset.cand, b.dataset.cname); if (p) openPerson(p);
    else openSheet({ title: b.dataset.cname, html: '<p class="small muted">We don’t have a profile for this candidate yet. Their party’s website, policy.nz and vote.nz list the candidates standing.</p>' }) });
  $('#el-print').onclick = () => window.print();
  const cmp = $('#el-compare'); if (cmp) cmp.onclick = () => compareCands(sel);
};

/* ===== Parties: list (A–Z or ballot order) and the party page (Overview · Policies · Record · People · History) ===== */
// Every party in the guide: the 2026 party-vote list plus any other group whose policies are on file.
// mode 'az' = A–Z by short name (default everywhere); 'ballot' = alphabetical by registered name, as on the ballot paper.
// Never sorted by polling (only Seats › Polls does that, and says so).
function partyOrder(mode = 'az') {
  const gp = (G().parties || []).map(p => p.slug);
  const known = Object.keys(S.data.parties).filter(s => gp.includes(s) || P(s).policy_count > 0);
  const key = mode === 'ballot' ? s => (guideParty(s) || {}).name || P(s).name || pname(s) : s => pname(s);
  return [...new Set([...gp, ...known])].filter(s => S.data.parties[s] || guideParty(s)).sort((a, b) => ptCmp(key(a), key(b)) || ptCmp(a, b));
}
const onBallot = s => (G().parties || []).some(p => p.slug === s);
function leaderFaces(s) { const g = guideParty(s); const ls = (g && g.leaders) || []; return ls.map(l => findPerson(l.slug, l.name)).filter(Boolean) }
function partySeats(s) { const g = guideParty(s); if (g && g.current_seats && g.current_seats.seats != null) return g.current_seats.seats; return (currentParl() && (currentParl().composition_now_or_end || {})[s]) || 0 }
// Glance row used on the parties list (and by any other view that wants a party row). No polling.
function partyCard(s) {
  const g = guideParty(s) || {}; const pp = P(s); const seats = partySeats(s);
  const meta = [seats ? `${seats} MP${seats === 1 ? '' : 's'}` : 'No MPs', pp.policy_count ? `${pp.policy_count} ${pp.policy_count === 1 ? 'policy' : 'policies'}` : ''].filter(Boolean).join(' · ');
  return `<a class="rowlink rowlink--plain party-row" href="#/parties/${esc(s)}" style="--pc:${pcolor(s)}"><span class="stack stack--s"><span class="rowlink__title"><span class="ptag"><span class="sw"></span>${esc(g.name && S.partySort === 'ballot' ? g.name : pname(s))}</span></span>
    ${g.tagline || pp.intro ? `<span class="rowlink__sub">${esc(g.tagline || String(pp.intro).replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/[*_`]/g, '').slice(0, 180))}</span>` : ''}<span class="micro muted">${meta}</span></span>${ic('chev')}</a>`;
}

const PARTY_TABS = [['glance', 'Overview', ''], ['policies', 'Policies', '/policies'], ['record', 'Record', '/record'], ['people', 'People', '/people'], ['history', 'History', '/history']];

        <div class="stack stack--s"><p class="eyebrow">${label ? (/^no /i.test(label) ? 'No position label' : esc(label)) + ` <span class="phead__src">(${pos.source ? ptExt(pos.source, "Wikipedia's label") : "Wikipedia's label"})</span>` : ''}${g.founded ? ` · Founded ${esc(g.founded)}` : ''}</p>

    body.innerHTML = `<div class="party-layout party-layout--history"><div class="party-layout__main stack"><div class="shead"><h2>History and profile</h2></div>

function partyOverview(s, pols, prom) {
  const g = guideParty(s) || {}; const pp = P(s);
  const cur = g.current_seats || {}; const seats = partySeats(s);
  const topics = new Set(pols.map(topicOf)).size;

  const costYes = cost && cost.published === true;

  // Big ideas: each idea links to the policies behind it; "Read the full text" opens the party's own document.
  const ideas = (g.big_ideas || []).length ? g.big_ideas.map((b, i) => { const ids = (b && b.policy_ids) || []; const ps = pols.filter(x => ids.includes(x.id)); const docs = ideaDocs(ps);
      return `<li><div><span class="idea__t">${esc(b.text || b)}</span><span class="pol__m">${ps.length ? `${ps.length} ${ps.length === 1 ? 'policy' : 'policies'}` : ''}${docs.length ? `${ps.length ? ' · ' : ''}<button class="linkbtn" type="button" data-idea="${i}">Read the full text</button>` : ''}${!docs.length && b.source ? `${ps.length ? ' · ' : ''}${ptExt(b.source, 'source')}` : ''}</span></div></li>` })
    : pols.filter(isKey).slice(0, 7).map(x => `<li><div><span class="idea__t">${esc(x.statement)}</span><span class="pol__m">${esc(TOPIC_NAMES[topicOf(x)] || 'Other')}${ideaDocs([x]).length ? ` · <button class="linkbtn" type="button" data-doc="${esc(s)}|${esc(ideaDocs([x])[0])}">Read the full text</button>` : ''}</span></div></li>`);
  const cs = g.coalition_stance_2026; const csObj = cs && typeof cs === 'object' ? cs : { summary: T(cs) };
  const chips = (L, no) => (L || []).slice().sort((a, b) => ptCmp(pname(a), pname(b))).map(x => `<a class="pchip${no ? ' pchip--no' : ''}" href="#/parties/${esc(x)}" style="--pc:${pcolor(x)}"><span class="sw"></span>${esc(pname(x))}</a>`).join('');
  const side = (v, cls, k) => T(v) ? `<div class="side${cls}"><span class="eyebrow">${k}</span><blockquote>${esc(T(v))}</blockquote><p class="src"><span class="nm">${[v.attribution || v.who, v.date ? ptDate(v.date) : ''].filter(Boolean).map(esc).join(' · ')}</span>${srcOf(v).length ? ' · ' + ptSources(v) : ''}</p></div>` : '';
  return `<div class="party-layout">
    <dl class="glance">
      <div><dt>MPs now</dt><dd>${seats}<small>of ${esc(cur.of || (currentParl() || {}).total_now_or_end || 123)} seats${cur.as_of ? ' · ' + ptDate(cur.as_of, { day: 'numeric', month: 'short' }) : ''}</small></dd></div>
      <div><dt>2026 policies</dt><dd>${pols.length}<small>${pols.length ? `${topics} topic${topics === 1 ? '' : 's'}` : 'none on file yet'}</small></dd></div>
      <div><dt>Promises checked</dt><dd>${prom.length || '–'}<small>${prom.length ? 'with sources' : 'not tracked yet'}</small></dd></div>
      <div><dt>Numbers costed?</dt><dd>${cost ? (costYes ? 'Yes' : 'No') : '–'}<small>${cost ? (costYes ? 'party-published' : 'no full plan found') : 'not checked'}</small></dd></div>
    </dl>
    <div class="stack stack--xl party-layout__main">
      ${sec('nut', 'In a nutshell', g.in_a_nutshell ? `<div class="prose"><p>${esc(g.in_a_nutshell)}</p></div>` : pp.intro ? `<div class="prose">${md(pp.intro)}</div>` : '<p class="muted">A plain summary has not been written yet.</p>')}
      ${sec('big', (g.big_ideas || []).length ? 'Big ideas for 2026' : 'Headline policies', ideas.length ? `<ol class="ideas">${ideas.join('')}</ol>` : '<p class="muted">No headline policies on file yet.</p>', pols.length ? `<a class="more small" href="#/parties/${esc(s)}/policies">All ${pols.length} policies ${ic('chev', 'i--xs')}</a>` : '')}
      ${sec('sides', 'Two sides', T(g.they_say) || T(g.critics_say) ? `<div class="sides">${side(g.they_say, '', 'What they say')}${side(g.critics_say, ' side--critics', 'What critics say')}</div>` : '<p class="muted">Not summarised yet.</p>')}
      ${sec('work', "Who they'd work with", `${(csObj.open_to || []).length || (csObj.rules_out || []).length || csObj.conditions ? `<div class="works">${(csObj.open_to || []).length ? `<div class="works__row"><span>Open to</span><div class="row">${chips(csObj.open_to)}</div></div>` : ''}${(csObj.rules_out || []).length ? `<div class="works__row"><span>Ruled out</span><div class="row">${chips(csObj.rules_out, true)}</div></div>` : ''}${csObj.conditions ? `<div class="works__row"><span>Conditions</span><p style="padding-top:6px">${esc(T(csObj.conditions))}</p></div>` : ''}</div>` : ''}
        ${T(csObj) ? `<p class="small soft">${esc(T(csObj))}</p>` : '<p class="muted">No public statement on post-election partners found.</p>'}${csObj.note ? `<p class="small soft">${esc(csObj.note)}</p>` : ''}
        <p class="src">${csObj.as_of ? 'As of ' + ptDate(csObj.as_of) : ''}${srcOf(csObj).length ? (csObj.as_of ? ' · ' : '') + ptSources(csObj) : ''}</p>`)}
      ${recordSummary(s)}
      ${sec('cost', 'Are the numbers costed?', cost ? `<p><span class="badge ${costYes ? 'badge--ink' : 'badge--outline'}">${costYes ? 'Yes, party-published' : 'No full costing published'}</span></p>${T(cost) ? `<p class="soft">${esc(T(cost))}</p>` : ''}<p class="src">${cost.date ? ptDate(cost.date) : 'Date not recorded'}${srcOf(cost).length ? ' · ' + ptSources(cost) : ''}</p>` : '<p class="muted">Not checked yet.</p>')}
      ${sec('deep', 'Go deeper', `<div class="rows" style="border-top:0">
        ${pp.has_readme ? deepRow('book', 'Full party profile and history', `${g.founded ? 'Founded ' + esc(g.founded) + ' · ' : ''}leaders · every result`, `#/about/page/parties/${s}/README.md`) : ''}
        ${pp.has_track_record ? deepRow('history', 'Full track record, with sources', prom.length ? `${prom.length} promises checked` : 'The written record', `#/about/page/parties/${s}/track-record.md`) : ''}
        ${deepRow('doc', 'Policy index', `${pols.length} policies${pols.length ? ` across ${topics} topic${topics === 1 ? '' : 's'}` : ''}, with the documents they come from`, `#/about/page/parties/${s}/policies/README.md`)}
        ${deepRow('news', 'From the party', 'Latest press releases and where to follow them', `#/parties/news/${s}`)}
        ${g.website ? deepRow('ext', 'Party website', esc(ptHost(g.website)), g.website, true) : ''}</div>`, '', true)}
    </div>
    <aside class="stack stack--l party-layout__side">${partyResultsMini(s)}
      ${(g.sources || []).length ? `<details class="disclose"><summary>Sources for this summary <span class="micro muted">${g.sources.length}</span></summary><div class="disclose__body"><ul class="small src-list">${g.sources.map(u => { const url = typeof u === 'string' ? u : u.url; return `<li>${ptExt(url, esc(typeof u === 'string' ? ptSrcLabel(u) : (u.title || u.url)))}</li>` }).join('')}</ul></div></details>` : ''}
      <p class="src">${ic('clock')} Summary checked ${ptDate((cur.as_of || (S.data.generated || '').slice(0, 10)))} · <a href="${CORRECTION_URL}" target="_blank" rel="noopener">report an error</a></p></aside>
  </div>`;
}
const ptSrcLabel = u => { try { const x = new URL(u); return (x.hostname.replace(/^www\./, '') + decodeURIComponent(x.pathname).replace(/\/$/, '')).slice(0, 72) } catch { return String(u).slice(0, 72) } };
const deepRow = (icon, title, sub, href, ext = false) => `<a class="rowlink" href="${esc(href)}"${ext ? ' target="_blank" rel="noopener"' : ''}><span class="rowlink__icon">${ic(icon)}</span><span><span class="rowlink__title">${esc(title)}</span><span class="rowlink__sub" style="display:block">${sub}</span></span>${ic('chev')}</a>`;
// Documents behind a set of policies, de-duplicated, in policy order.
function ideaDocs(ps) { const seen = new Set(); const out = []; for (const x of ps) for (const d of (x.sources || [])) if (d.document && !seen.has(d.document)) { seen.add(d.document); out.push(d.document) } return out }
function bindIdeas(el, s) {
  el.querySelectorAll('[data-idea]').forEach(b => b.onclick = () => { const idea = (guideParty(s) || {}).big_ideas[+b.dataset.idea]; const ps = (S.policies[s] || []).filter(x => (idea.policy_ids || []).includes(x.id));
    const docs = ideaDocs(ps); if (docs.length) openDoc(s, docs[0], { related: docs, context: idea.text || '' }) });
}

/* ----- Keeping their word (party Overview and Record tab) ----- */
function recordSummary(s, { inRecord = false } = {}) {
  const all = (S.data.promises || {})[s] || []; const g = guideParty(s) || {};
  const head = `<div class="shead"><div class="shead__row"><h2 id="h-rec">Keeping their word</h2>${all.length ? `<span class="micro muted">${all.length} promises tracked</span>` : ''}</div></div>`;
  if (!all.length) return `<section class="stack" aria-labelledby="h-rec">${head}<p class="muted">The promise check for this party is still being researched.</p>${P(s).has_track_record ? `<a class="more small" href="#/about/page/parties/${esc(s)}/track-record.md">Read the written track record ${ic('chev', 'i--xs')}</a>` : ''}</section>`;
  const terms = TERMS.map(([k, l]) => [k, l, all.filter(x => periodOf(x) === k)]).filter(([, , L]) => L.length);
  const sc = scoreOf(all);
  return `<section class="stack" aria-labelledby="h-rec">${head}
    ${T(g.track_record_line) ? `<p class="soft">${esc(T(g.track_record_line))}</p>` : ''}
    <p class="small"><b>All time:</b> ${sc.n} promises checked${sc.score != null ? `, <b>${sc.score}%</b> kept` : ''}.</p>
    <div class="terms">${terms.map(([k, l, L]) => { const t = scoreOf(L); return `<div class="term"><div class="term__h"><span><b>${esc(l)}</b> · ${t.n} checked</span><span class="muted">${t.score != null ? `${t.score}% kept` : 'Not yet due'}</span></div>${verdictMeter(L, l)}</div>` }).join('')}</div>
    <div class="legend">${VERDICTS.filter(v => all.some(x => x.status === v)).map(v => `${verdictChip(v)}<b>${all.filter(x => x.status === v).length}</b>`).map(x => `<span>${x}</span>`).join('')}</div>
    ${RUBRIC_HTML('How each promise was judged')}
    <div class="row">${inRecord ? '' : `<a class="more small" href="#/parties/${esc(s)}/record">See every promise, with sources ${ic('chev', 'i--xs')}</a>`}${P(s).has_track_record ? `<a class="more small" href="#/about/page/parties/${esc(s)}/track-record.md">Full track record ${ic('chev', 'i--xs')}</a>` : ''}</div></section>`;
}
// Party vote at each election since 2008, as .rrow bars (party colour only via --pc).
function partyResultsMini(s, big = false) {
  const els = S.data.elections.filter(e => e.year >= 2008); const rows = els.map(e => { const r = (e.parties || []).find(x => x.party === s); return [e.year, r] });
  if (!rows.some(([, r]) => r)) return `<section class="stack stack--s"><h2 class="h4">Party vote at each election</h2><p class="small muted">Has not stood for the party vote at an election since 2008.</p></section>`;
  const max = Math.max(10, ...rows.map(([, r]) => r ? r.party_vote_pct : 0));
  return `<section class="stack stack--s" aria-labelledby="h-res"><h2 id="h-res" class="h4">Party vote at each election</h2><div>${rows.map(([y, r], i) => `<div class="rrow rrow--yr" style="--pc:${pcolor(s)}"><span class="num">${y}</span><div class="bar"><i style="--w:${r ? (r.party_vote_pct / max * 100).toFixed(1) : 0}%;--i:${i}"></i></div><span class="rrow__v">${r ? `<b>${fmt(r.party_vote_pct)}%</b><span>${r.total_seats || 0} seat${r.total_seats === 1 ? '' : 's'}</span>` : '<span>did not stand</span>'}</span></div>`).join('')}</div>
    <p class="src">Electoral Commission results, via Wikipedia: ${els.map(e => { const u = String((e.sources || [])[0] || '').split(' ')[0]; return u ? ptExt(u, String(e.year)) : '' }).join(' ')}${big ? ' · bars scaled to the party’s best result' : ''}</p></section>`;
}

/* ----- policy browser (shared: Parties › Policies and each party's Policies tab) ----- */
const TOPIC_NAMES = { economy: 'Economy & tax', health: 'Health', education: 'Education', housing: 'Housing', environment: 'Environment & climate', 'law-justice-and-government': 'Law, justice & government',
  'community-and-inclusion': 'Community & inclusion', 'te-ao-maori': 'Te ao Māori', migration: 'Immigration', 'transport-and-infrastructure': 'Transport & infrastructure',
  'incomes-and-employment': 'Incomes & jobs', 'defence-and-foreign-affairs': 'Defence & foreign affairs', 'media-culture-and-recreation': 'Media, culture & recreation' };
const isKey = x => !!(x.key_policy || (x.topics || []).some(t => String(t).startsWith('key-policies')));
const topicOf = pol => (pol.topics || []).find(x => TOPIC_NAMES[x]) || 'other';
const DOC_DEPTH = ['Summary', 'Policy', 'Full text'];
// Source line for one policy: one "Read the full text" control (the party's own document, in the reader sheet) plus the original links.
function docButtons(p, pol) {
  const docs = ideaDocs([pol]); const links = (pol.sources || []).filter(x => x.url);
  const seen = new Set(); const uniq = links.filter(x => !seen.has(x.url) && seen.add(x.url));
  if (!docs.length && !uniq.length) return '<p class="src">No source recorded</p>';
  return `<p class="src">${docs.length ? `<button class="linkbtn" type="button" data-doc="${esc(p)}|${esc(docs[0])}">Read the full text</button>${docs.length > 1 ? `<span>${docs.length} documents</span>` : ''}` : ''}
    ${uniq.map(x => { const t = String(x.title || '').replace(/^['"‘]|['"’]$/g, '').replace(/['"’],.*$/, ''); return ptExt(x.url, esc(t ? (t.length > 48 ? t.slice(0, 46) + '…' : t) : ptHost(x.url) || 'original source') + ' ' + ic('ext', 'i--xs')) }).join('')}${pol.summary_source ? `<span>Summary: ${esc(String(pol.summary_source).replace(/^archive\b/, 'Ballot Book'))}</span>` : ''}</p>`;
}
function policyCard(p, pol, showParty = true) {
  const sm = pol.summary || {};
  return `<article class="pol" style="--pc:${pcolor(p)}"><p class="pol__t st">${esc(pol.statement)}</p>
    <p class="pol__m">${showParty ? ptTag(p) : ''}<span>${esc(TOPIC_NAMES[topicOf(pol)] || 'Other')}</span>${isKey(pol) ? '<span class="badge badge--outline">Headline policy</span>' : ''}</p>
    ${sm.why || sm.how || sm.text || pol.costing ? `<details class="disclose disclose--pol"><summary>Why and how</summary><div class="disclose__body small">${sm.why ? `<p><b>Why:</b> ${esc(sm.why)}</p>` : ''}${sm.how ? `<p><b>How:</b> ${esc(sm.how)}</p>` : ''}${sm.text ? `<p>${esc(sm.text)}</p>` : ''}${sm.cost || pol.costing ? `<p><b>Cost:</b> ${esc(sm.cost || (typeof pol.costing === 'string' ? pol.costing : JSON.stringify(pol.costing)))}</p>` : ''}</div></details>` : ''}
    ${docButtons(p, pol)}</article>`;
}
async function policyBrowser(el, only = null, { topic = '' } = {}) {
  if (!S.policies) S.policies = await getJSON('data/policies.json').catch(() => ({}));
  const parties = (only || Object.keys(S.policies)).filter(p => (S.policies[p] || []).length).sort((a, b) => ptCmp(pname(a), pname(b)));
  if (!parties.length) { el.innerHTML = '<p class="muted">Policies for this party are still being collected.</p>'; return }
  const single = !!(only && only.length === 1);
  let t = TOPIC_NAMES[topic] || topic === 'other' ? topic : '', q = '', limit = 40; const on = new Set(parties);
  el.innerHTML = `<div class="stack stack--l"><div class="toolbar">
      <div class="input-icon">${ic('search', 'i--s')}<input class="input" type="search" id="q" placeholder="Search, e.g. GST, rent, KiwiSaver, gangs" aria-label="Search policies"></div>
      <div class="chips chips--scroll" id="tchips" role="group" aria-label="Topic"></div>
      ${single ? '' : `<details class="disclose"><summary>Parties <span class="micro muted" id="pcount" style="margin-left:auto">all ${parties.length} shown</span></summary><div class="disclose__body"><div class="chips" id="pchips" role="group" aria-label="Parties">${parties.map(p => `<button class="chip" type="button" data-p="${p}" aria-pressed="true"><span class="sw" style="--pc:${pcolor(p)}"></span>${esc(pname(p))} <span class="count">${S.policies[p].length}</span></button>`).join('')}<button class="linkbtn small" type="button" id="pall">All parties</button></div></div></details>`}</div>
    <div id="plist" class="stack stack--l"></div></div>`;
  const matchQ = pol => !q || (pol.statement + ' ' + JSON.stringify(pol.summary || {})).toLowerCase().includes(q);
  const drawTopics = () => { const n = k => parties.filter(p => on.has(p)).reduce((a, p) => a + S.policies[p].filter(x => matchQ(x) && (!k || topicOf(x) === k)).length, 0);
    $('#tchips', el).innerHTML = [['', 'All topics'], ...Object.entries(TOPIC_NAMES), ['other', 'Other']].map(([k, l]) => [k, l, n(k)]).filter(([k, , c]) => !k || c || k === t).map(([k, l, c]) => `<button class="chip" type="button" data-t="${k}" aria-pressed="${t === k}">${esc(l)} <span class="count">${c}</span></button>`).join('') };
  const draw = () => { drawTopics(); const tc = $('#tchips', el), cur = tc.querySelector('[aria-pressed="true"]'); if (cur && t) tc.scrollLeft = Math.max(0, cur.offsetLeft - tc.offsetLeft - 16);
    const match = pol => (!t || topicOf(pol) === t) && matchQ(pol); const box = $('#plist', el);
    if (t && !single) { const ps = parties.filter(p => on.has(p));   // a topic picked: parties side by side, A–Z
      box.innerHTML = `<p class="small muted">${esc(TOPIC_NAMES[t] || 'Other')}: ${ps.length} parties, A to Z. Each column is that party's published policies on this topic.</p>
        <div class="cols ${ps.length > 2 ? 'cols--3' : 'cols--2'} pcols">${ps.map(p => { const L = S.policies[p].filter(match);
        return `<section class="pgroup" style="--pc:${pcolor(p)}"><div class="pgroup__h"><h3>${esc(pname(p))}</h3><a class="more micro" href="#/parties/${esc(p)}/policies">All ${S.policies[p].length}</a></div>${L.length ? L.map(x => policyCard(p, x, false)).join('') : '<p class="small muted">Nothing published on this topic.</p>'}</section>` }).join('')}</div>`; return }
    const all = []; parties.filter(p => on.has(p)).forEach(p => S.policies[p].filter(match).forEach(x => all.push([p, x])));
    if (single && !q && !t) { // one party, no filter: grouped by topic
      const by = {}; all.forEach(([p, x]) => (by[topicOf(x)] = by[topicOf(x)] || []).push([p, x]));
      box.innerHTML = `<p class="small muted">${all.length} policies in ${Object.keys(by).length} topics. Open a topic, or pick one above.</p><div>${Object.entries(by).sort((a, b) => b[1].length - a[1].length || ptCmp(TOPIC_NAMES[a[0]] || 'Other', TOPIC_NAMES[b[0]] || 'Other')).map(([tp, xs]) => `<details class="disclose"><summary>${esc(TOPIC_NAMES[tp] || 'Other')} <span class="micro muted" style="margin-left:auto">${xs.length}</span></summary><div class="disclose__body">${xs.map(([p, x]) => policyCard(p, x, false)).join('')}</div></details>`).join('')}</div>`;
      return }
    box.innerHTML = `<p class="small muted">${all.length} matching ${all.length === 1 ? 'policy' : 'policies'}${single ? '' : ', grouped by party A to Z'}</p><div>${all.slice(0, limit).map(([p, x]) => policyCard(p, x, !single)).join('')}</div>${all.length > limit ? `<div class="row"><button class="btn" type="button" id="more">Show the next ${Math.min(40, all.length - limit)}</button><span class="small muted">${limit} of ${all.length} shown</span></div>` : ''}`;
    const m = $('#more', el); if (m) m.onclick = () => { limit += 40; draw() } };
  $('#q', el).oninput = e => { q = e.target.value.trim().toLowerCase(); limit = 40; draw() };
  $('#tchips', el).onclick = e => { const b = e.target.closest('[data-t]'); if (!b) return; t = b.dataset.t; limit = 40; draw() };
  const pc = $('#pchips', el); if (pc) pc.onclick = e => { if (e.target.closest('#pall')) parties.forEach(p => on.add(p)); else { const b = e.target.closest('[data-p]'); if (!b) return; on.has(b.dataset.p) ? on.delete(b.dataset.p) : on.add(b.dataset.p) }
    pc.querySelectorAll('[data-p]').forEach(x => x.setAttribute('aria-pressed', on.has(x.dataset.p))); $('#pcount', el).textContent = on.size === parties.length ? `all ${parties.length} shown` : `${on.size} of ${parties.length} shown`; limit = 40; draw() };
  draw();
}

// Layer 3: the party's own document in the reader sheet.
async function openDoc(party, path, { related = null, context = '' } = {}) {
  if (!S.policies) S.policies = await getJSON('data/policies.json').catch(() => ({}));
  if (!related) { const pol = (S.policies[party] || []).find(x => (x.sources || []).some(d => d.document === path));   // the policy this document backs
    if (pol) { related = ideaDocs([pol]); if (!context) context = 'Policy: ' + pol.statement } }
  openSheet({ title: 'Loading…', depth: DOC_DEPTH, at: 2, html: '<p class="muted">Fetching the full text…</p>' });
  if (!S.fulltext[party]) S.fulltext[party] = await getJSON(`data/fulltext/${party}.json`).catch(() => ({}));
  const d = S.fulltext[party][path];
  if (!d) { openSheet({ title: 'Not found', depth: DOC_DEPTH, at: 2, src: ptTag(party), html: `<p>This document isn't in the bundle yet (${esc(path)}).</p>` }); return }
  const others = (related || []).filter(x => x !== path && S.fulltext[party][x]);
  openSheet({ title: d.title || path, depth: DOC_DEPTH, at: 2,
    src: `${ptTag(party)}${d.source_url ? ptExt(d.source_url, esc(ptHost(d.source_url) || 'original source')) : '<span>No original link recorded</span>'}${d.retrieved ? `<span>retrieved ${esc(ptDate(d.retrieved))}</span>` : ''}`,
    html: `${context ? `<p class="small soft">${esc(context)}</p>` : ''}<div class="note">${ic('info')}<div>The party's own words, shown as published. Not edited or fact-checked.</div></div>
      <div class="prose" data-base="parties/${esc(party)}/policies/${esc(path)}">${md(d.text)}</div>
      <div class="row">${d.source_url ? `<a class="btn btn--s" href="${esc(d.source_url)}" target="_blank" rel="noopener">Original page ${ic('ext', 'i--xs')}</a>` : ''}<a class="btn btn--s btn--quiet" href="${CORRECTION_URL}" target="_blank" rel="noopener">${ic('flag', 'i--xs')} Report a problem</a></div>
      ${others.length ? `<section class="stack stack--s"><h3 class="h4">Other documents behind this</h3><div class="rows">${others.map(x => `<button class="rowlink rowlink--plain doc-row" type="button" data-doc="${esc(party)}|${esc(x)}"><span class="rowlink__title" style="font-size:15px">${esc(S.fulltext[party][x].title || x)}</span>${ic('chev')}</button>`).join('')}</div></section>` : ''}` });
}
