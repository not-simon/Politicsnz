    const counts = {}; B.forEach(p => { const k = kind === 'party' ? p.party : p.electorate_2026; counts[k] = (counts[k] || 0) + 1 });
    const keys = Object.keys(counts).sort((a, b) => kind === 'party' ? ptCmp(pname(a), pname(b)) : ptCmp(a, b)); const cur = kind === 'party' ? f.party : f.elect;
    openSheet({ title: kind === 'party' ? 'Choose a party' : 'Choose an electorate', html: `<div class="rows">${[['', kind === 'party' ? 'Any party' : 'Any electorate', B.length], ...keys.map(k => [k, kind === 'party' ? pname(k) : k, counts[k]])].map(([k, l, n]) => `<button class="rowlink rowlink--plain pick-row" type="button" data-pick="${esc(k)}"${k === cur ? ' aria-current="true"' : ''}><span class="row row--nowrap" style="gap:10px">${kind === 'party' && k ? `<span class="sw" style="--pc:${pcolor(k)}"></span>` : ''}<span class="rowlink__title" style="font-size:16px">${esc(l)}</span></span><span class="small muted">${n}${k === cur ? ' ' + ic('check', 'i--xs') : ''}</span></button>`).join('')}</div>` });
    $('#sheet-body').querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { if (kind === 'party') f.party = b.dataset.pick; else f.elect = b.dataset.pick; limit = 120; closeSheet(); draw() }) };
  $('#pq', el).oninput = e => { f.q = e.target.value.trim().toLowerCase(); limit = 120; draw() };
  el.addEventListener('click', e => {
    const st = e.target.closest('[data-st]'); if (st) { f.st = st.dataset.st; limit = 120; draw(); return }
    const mn = e.target.closest('[data-menu]'); if (mn) { menu(mn.dataset.menu); return }
    const lt = e.target.closest('[data-letter]'); if (lt) { e.preventDefault(); limit = Infinity; draw(); const h = $('#pl-' + lt.dataset.letter, el); if (h) h.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); return }
    const b = e.target.closest('a.person[data-i]'); if (b && !e.metaKey && !e.ctrlKey && !e.shiftKey) { e.preventDefault(); openPerson(S.people[+b.dataset.i]) } });
  draw() }

/* ----- promises: what each party said it would do, checked against what happened (verdict + sources on every one) ----- */
const VERDICTS = ['kept', 'partially-kept', 'in-progress', 'broken', 'abandoned', 'not-yet-due'];
const VMETA = { kept: ['kept', 'check', 'Kept'], 'partially-kept': ['partly', 'half', 'Partly kept'], 'in-progress': ['progress', 'play', 'In progress'], broken: ['broken', 'x', 'Broken'], abandoned: ['abandoned', 'minus', 'Abandoned'], 'not-yet-due': ['notdue', 'clock', 'Not yet due'] };
const vMeta = v => VMETA[v] || ['notdue', 'help', String(v || 'Unknown').replace(/-/g, ' ')];
// Verdict chip: icon + word + colour, never colour alone.
const verdictChip = v => { const [c, i, l] = vMeta(v); return `<span class="verdict v-${c}">${ic(i)}${esc(l)}</span>` };
const TERMS = [['2008-17', '2008–17'], ['2017-23', '2017–23'], ['2023-26', '2023–26'], ['2026', '2026 campaign']];
const PERIODS = [['all', 'All time'], ['since2017', 'Since 2017'], ['current', '2023–26 term'], ['2026', '2026 promises'], ['byterm', 'By term']];
function periodOf(x) { const m = String((x.made || '') + ' ' + (x.term || '')).match(/\b(20[0-2]\d)\b/); if (!m) return 'other'; const y = +m[1];
  return y <= 2016 ? '2008-17' : y <= 2022 ? '2017-23' : y <= 2025 ? '2023-26' : '2026' }
function inPeriod(x, per) { const t = periodOf(x); return per === 'all' || per === 'byterm' ? true : per === 'since2017' ? (t === '2017-23' || t === '2023-26') : per === 'current' ? t === '2023-26' : per === '2026' ? t === '2026' : true }
function periodBar(id) { const cur = S.promPeriod || 'all'; return `<div class="seg" id="${id}" role="group" aria-label="Period" style="justify-self:start">${PERIODS.map(([k, l]) => `<button type="button" data-per="${k}" aria-pressed="${cur === k}">${l}</button>`).join('')}</div>` }
function scoreOf(L) { const c = v => L.filter(x => x.status === v).length; const resolved = L.filter(x => ['kept', 'partially-kept', 'broken', 'abandoned'].includes(x.status)).length;
  return { n: L.length, kept: c('kept'), partly: c('partially-kept'), broken: c('broken'), abandoned: c('abandoned'), progress: c('in-progress'), due: c('not-yet-due'), resolved, score: resolved ? Math.round((c('kept') + .5 * c('partially-kept')) / resolved * 100) : null } }
// Stacked verdict meter (.vmeter > i.v-* with --n). `label` names it for screen readers.
function verdictMeter(L, label = '') { const parts = VERDICTS.map(v => [v, L.filter(x => x.status === v).length]).filter(([, n]) => n);
  const aria = (label ? label + ': ' : '') + (parts.map(([v, n]) => `${n} ${vMeta(v)[2].toLowerCase()}`).join(', ') || 'none');
  return `<div class="vmeter" role="img" aria-label="${esc(aria)}">${parts.map(([v, n], i) => `<i class="v-${vMeta(v)[0]}" style="--n:${n};--i:${i}"></i>`).join('')}</div>` }
// The verdict rules: the same definitions for every party.
const RUBRIC_HTML = (title = 'How verdicts are decided', open = false) => `<details class="disclose"${open ? ' open' : ''}><summary>${esc(title)}</summary><div class="disclose__body small">
  <ul class="rubric"><li>${verdictChip('kept')} delivered as promised, in substance and timing.</li><li>${verdictChip('partially-kept')} delivered in part, late, or in a narrower form.</li><li>${verdictChip('broken')} not delivered while the party had the power to deliver it.</li><li>${verdictChip('abandoned')} dropped by the party itself (often in coalition talks); the entry says who dropped it and why.</li><li>${verdictChip('in-progress')} still being implemented.</li><li>${verdictChip('not-yet-due')} promised for after the election.</li></ul>
  <p>Each promise lists what was said (with a link to where it was said), what happened (with sources), and the verdict. The same definitions are applied to every party. Parties in opposition have fewer promises that can be judged, which is noted. "% kept" counts a partly kept promise as half and leaves out promises still in progress or not yet due.</p></div></details>`;
function byTermTable(parties, pr) { return `<div class="table-wrap"><table class="table"><thead><tr><th>Party</th>${TERMS.map(([, l]) => `<th>${l}</th>`).join('')}</tr></thead><tbody>${parties.map(p => `<tr><td>${ptTag(p, 'ptag')}</td>${TERMS.map(([k, l]) => { const L = (pr[p] || []).filter(x => periodOf(x) === k); if (!L.length) return '<td class="muted">–</td>'; const sc = scoreOf(L); return `<td class="term-cell">${verdictMeter(L, pname(p) + ', ' + l)}<div class="micro muted" style="margin-top:4px">${sc.n} checked${sc.score != null ? ` · <b>${sc.score}%</b> kept` : ' · not yet due'}</div></td>` }).join('')}</tr>`).join('')}</tbody></table></div>
  <p class="micro muted">Terms are when the promise was made: 2008–17 covers the National-led years, 2017–23 the Labour-led years, 2023–26 the current term.</p>` }
const MAIN7 = ['national', 'labour', 'green', 'act', 'nz-first', 'te-pati-maori', 'opportunity'];

V.promises = arg => { const pr = S.data.promises || {};
  const parties = Object.keys(pr).filter(p => (pr[p] || []).length).sort((a, b) => ptCmp(pname(a), pname(b)));
  S.promPeriod = store.get('promPeriod') || S.promPeriod || 'all';
  const first = parties.includes(arg) ? arg : parties[0];
  $('#main').innerHTML = sectionFrame('parties', 'parties/promises', `<header class="pagehead"><p class="eyebrow eyebrow--signal">${ic('history', 'i--s')} Parties · Promises</p><h1>Promises against delivery</h1>
      <p class="lede">Promises from past campaigns and coalition deals, each checked against what happened, with sources. Choose a period: the whole record, the last two governments, or just the current term.</p></header>
    ${RUBRIC_HTML('How verdicts are decided')}
    <section class="stack"><div class="shead"><div class="shead__row"><h2>By party</h2><span class="micro muted">A to Z</span></div></div>
      ${periodBar('prper')}<div id="prtable" class="stack"></div></section>
    <section class="stack" id="prsec"><div class="shead"><div class="shead__row"><h2>Every promise</h2><span class="micro muted">pick a party</span></div></div><div id="pl"></div></section>`);
  const drawTable = () => { const per = S.promPeriod || 'all'; const t = $('#prtable');
    if (per === 'byterm') { t.innerHTML = byTermTable(parties, pr); return }
    const rows = parties.map(p => ({ p, L: (pr[p] || []).filter(x => inPeriod(x, per)) })).filter(r => r.L.length);
    t.innerHTML = `<div class="terms">${rows.map(({ p, L }) => { const sc = scoreOf(L); return `<div class="term"><div class="term__h"><span><a class="ptag" href="#/parties/${esc(p)}/record" style="--pc:${pcolor(p)}"><span class="sw"></span>${esc(pname(p))}</a> · ${sc.n} checked</span><span class="muted">${sc.score == null ? 'Not yet due' : sc.score + '% kept'}</span></div>${verdictMeter(L, pname(p))}</div>` }).join('')}</div>
      <div class="legend">${VERDICTS.map(v => `<span>${verdictChip(v)}</span>`).join('')}</div>
      <details class="disclose"><summary>The numbers in a table</summary><div class="disclose__body"><div class="table-wrap"><table class="table"><thead><tr><th>Party</th><th class="n">Checked</th><th class="n">Kept</th><th class="n">Partly</th><th class="n">Broken / dropped</th><th class="n">In progress / not due</th><th class="n">% kept</th></tr></thead><tbody>
      ${rows.map(({ p, L }) => { const sc = scoreOf(L); return `<tr><td>${ptTag(p, 'ptag')}</td><td class="n">${sc.n}</td><td class="n">${sc.kept}</td><td class="n">${sc.partly}</td><td class="n">${sc.broken + sc.abandoned}</td><td class="n">${sc.progress + sc.due}</td><td class="n"><b>${sc.score == null ? '–' : sc.score + '%'}</b></td></tr>` }).join('')}</tbody></table></div></div></details>
      <p class="micro muted">Parties were assessed on different numbers of promises and from different positions (government, support partner, opposition); read each party's track record for the context.</p>` };
  $('#prper').onclick = e => { const b = e.target.closest('[data-per]'); if (!b) return; S.promPeriod = b.dataset.per; store.set('promPeriod', S.promPeriod); $('#prper').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.per === S.promPeriod)); drawTable(); if (parties.length) promiseList($('#pl'), S.promParty || first, parties) };
  drawTable(); if (parties.length) promiseList($('#pl'), first, parties) };

// Every promise for one party: verdict chip, what was said, what happened, all sources.
// `parties` given → party chips to switch (Promises page); otherwise the period switch is shown here (party Record tab).
function promiseList(el, party, parties = null) { const pr = S.data.promises || {}; S.promParty = parties ? party : S.promParty;
  if (!S.promPeriod) S.promPeriod = store.get('promPeriod') || 'all';
  if (!(pr[party] || []).length) { el.innerHTML = `${recordSummary(party, { inRecord: true })}`; return }
  const all = pr[party]; let vf = '', q = '';
  el.innerHTML = `<div class="stack stack--l">${parties ? `<div class="chips chips--scroll" role="group" aria-label="Party">${parties.map(p => `<button class="chip" type="button" data-prp="${esc(p)}" aria-pressed="${p === party}"><span class="sw" style="--pc:${pcolor(p)}"></span>${esc(pname(p))} <span class="count">${pr[p].length}</span></button>`).join('')}</div>` : ''}
    ${recordSummary(party, { inRecord: true })}
    <div class="toolbar">${parties ? '' : periodBar('prper2')}<div class="input-icon">${ic('search', 'i--s')}<input class="input" type="search" id="prq" placeholder="Search these promises" aria-label="Search promises"></div>
      <div class="chips chips--scroll" id="prv" role="group" aria-label="Verdict"></div></div>
    <div id="prlist"></div></div>`;
  const draw = () => { const per = S.promPeriod || 'all';
    const inP = all.filter(x => inPeriod(x, per)); const qq = q.toLowerCase();
    $('#prv', el).innerHTML = [['', 'All verdicts', inP.length], ...VERDICTS.filter(v => all.some(x => x.status === v)).map(v => [v, vMeta(v)[2], inP.filter(x => x.status === v).length])].map(([k, l, n]) => `<button class="chip" type="button" data-v="${k}" aria-pressed="${vf === k}">${k ? `<span class="v-${vMeta(k)[0]} vdot">${ic(vMeta(k)[1], 'i--xs')}</span>` : ''}${esc(l)} <span class="count">${n}</span></button>`).join('');
    const L = inP.filter(x => (!vf || x.status === vf) && (!qq || JSON.stringify(x).toLowerCase().includes(qq)));
    $('#prlist', el).innerHTML = `<p class="small muted">${L.length} promise${L.length === 1 ? '' : 's'}${per !== 'all' && per !== 'byterm' ? ' in this period' : ''}</p>
      <div class="promises">${L.map(x => `<article class="pol promise"><div class="row">${verdictChip(x.status)}<span class="micro muted">${esc(x.made || '')}${x.category ? ' · ' + esc(x.category) : ''}</span></div>
        <p class="pol__t st">${esc(x.promise)}</p>${x.detail ? `<p class="small soft">${esc(x.detail)}</p>` : ''}
        <p class="src">${(x.sources || []).length ? 'Sources: ' + ptSources(x.sources) : 'No source recorded'}${x.term ? ' · ' + esc(x.term) : ''}</p></article>`).join('') || '<p class="muted">No promises match.</p>'}</div>` };
  ptScrollChips(el.querySelector('[data-prp]') && el.querySelector('[data-prp]').parentElement);
  el.querySelectorAll('[data-prp]').forEach(b => b.onclick = () => promiseList(el, b.dataset.prp, parties));
  $('#prv', el).onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; vf = b.dataset.v; draw() };
  $('#prq', el).oninput = e => { q = e.target.value.trim(); draw() };
  const pb = $('#prper2', el); if (pb) pb.onclick = e => { const b = e.target.closest('[data-per]'); if (!b) return; S.promPeriod = b.dataset.per; store.set('promPeriod', S.promPeriod); pb.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.per === S.promPeriod)); draw() };
  draw() }

/* ----- From the parties: press releases (headline, date, link only) + follow directory ----- */
const ACCT_LABEL = { website: 'Website', facebook: 'Facebook', instagram: 'Instagram', x: 'X', tiktok: 'TikTok', youtube: 'YouTube', linkedin: 'LinkedIn' };
const ACCT_ORDER = ['website', 'facebook', 'instagram', 'x', 'tiktok', 'youtube', 'linkedin'];
function acctLinks(a, extra = []) { const out = Object.entries(a || {}).filter(([, u]) => u).sort((x, y) => ACCT_ORDER.indexOf(x[0]) - ACCT_ORDER.indexOf(y[0])).map(([k, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener nofollow">${ACCT_LABEL[k] || esc(k)}</a>`);
  for (const e of extra || []) out.push(`<a href="${esc(e.url || e)}" target="_blank" rel="noopener nofollow">${esc(e.label || e.kind || 'Other')}</a>`); return out.join('') }
// Only office addresses: Parliament or the party's own domain. Anything else (a personal mailbox) is never shown.
function officeEmail(email, party, N) { const m = String(email || '').toLowerCase().match(/@([a-z0-9.-]+)$/); if (!m) return '';
  const fp = (N.follow_parties || {})[party] || {}; const hosts = [ptHost((fp.accounts || {}).website), ptHost(fp.newsroom_url), ptHost((guideParty(party) || {}).website), 'parliament.govt.nz'].filter(Boolean).map(h => h.toLowerCase());
  return hosts.some(h => m[1] === h || m[1].endsWith('.' + h)) ? email : '' }
const newsDate = d => { const t = new Date(d); return isNaN(t) ? '' : t.toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' }) };
function releaseRow(i, withParty = false) {
  return `<a class="release" href="${esc(i.url)}" target="_blank" rel="noopener nofollow"><span class="release__t">${esc(i.title)}</span><span class="release__m">${withParty && i.party !== 'government' ? ptTag(i.party) : ''}${i.party === 'government' ? '<span class="badge badge--outline">Ministerial</span>' : ''}<span>${newsDate(i.date)}</span><span>${ic('ext', 'i--xs')} via ${esc(i.source || ptHost(i.url))}</span></span></a>` }

V.newsroom = async party => {
  if (!S.news) S.news = await getJSON('data/newsroom.json').catch(() => null);
  const N = S.news;
  if (!N || !N.items) { $('#main').innerHTML = sectionFrame('parties', 'parties/news', '<p class="muted">The press-release feed isn’t available in this build.</p>'); return }
  N.parties = N.parties || {}; N.follow_parties = N.follow_parties || {};
  const parties = partyOrder().filter(p => N.parties[p] || N.follow_parties[p]);    // A–Z by short name
  const sel = party && (N.parties[party] || N.follow_parties[party]) ? party : 'all';
  const mode = sel === 'all' && store.get('newsMode') === 'newest' ? 'newest' : 'three';
  const byDate = (a, b) => String(b.date).localeCompare(String(a.date));
  const items = N.items.filter(i => i.party !== 'government').sort(byDate);
  const gov = N.items.filter(i => i.party === 'government').sort(byDate);
  const win = N.window_days || 60;
  const quietLine = p => { const pm = N.parties[p] || N.follow_parties[p] || {}; return `<p class="small muted">No release in the last ${esc(win)} days in the feeds we read.${pm.newsroom_url ? ` <a href="${esc(pm.newsroom_url)}" target="_blank" rel="noopener nofollow">Their own newsroom ${ic('ext', 'i--xs')}</a>` : ''}</p>` };
  const group = (p, L, all = false) => `<section class="pgroup" style="--pc:${pcolor(p)}"><div class="pgroup__h"><h3>${esc(pname(p))}</h3>${all ? '' : `<a class="more micro" href="#/parties/news/${esc(p)}">All ${ic('chev', 'i--xs')}</a>`}</div>${L.length ? L.map(i => releaseRow(i)).join('') : quietLine(p)}</section>`;
  let feed;
  if (sel !== 'all') feed = group(sel, items.filter(i => i.party === sel), true);
  else if (mode === 'newest') feed = `<div>${items.map(i => releaseRow(i, true)).join('')}</div>`;
  else { // equal slots first: the latest three from every party, A to Z; then everything else newest first
    const seen = new Set(); const top = parties.map(p => { const L = items.filter(x => x.party === p).slice(0, 3); L.forEach(i => seen.add(i.url)); return [p, L] });
    const rest = items.filter(i => !seen.has(i.url));
    feed = `<div class="cols cols--2 news-cols">${top.map(([p, L]) => group(p, L)).join('')}</div>
      ${rest.length ? `<details class="disclose"><summary>Everything else, newest first <span class="micro muted" style="margin-left:auto">${rest.length} more</span></summary><div class="disclose__body">${rest.map(i => releaseRow(i, true)).join('')}</div></details>` : ''}` }
  const ministerial = sel === 'all' && gov.length ? `<section class="pgroup pgroup--gov" style="--pc:var(--text-3)"><div class="pgroup__h"><h3>Ministers’ releases</h3><span class="badge badge--outline">Ministerial</span></div>
      <p class="small soft">Official government announcements from the Beehive, not party releases. Shown separately so no party gets extra space for being in government.</p>
      ${gov.slice(0, 5).map(i => releaseRow(i)).join('')}${gov.length > 5 ? `<details class="disclose"><summary>${Math.min(gov.length, 30) - 5} more ministerial releases</summary><div class="disclose__body">${gov.slice(5, 30).map(i => releaseRow(i)).join('')}</div></details>` : ''}</section>` : '';
  // Follow directory: every party A–Z; in a single-party view, also each candidate's own public accounts.
  const followRow = p => { const fp = N.follow_parties[p]; return `<div class="follow__row"><a class="ptag" href="#/parties/news/${esc(p)}" style="--pc:${pcolor(p)}"><span class="sw"></span>${esc(pname(p))}</a><div class="follow__links">${fp ? acctLinks(fp.accounts) : ''}${fp && fp.newsroom_url ? `<a href="${esc(fp.newsroom_url)}" target="_blank" rel="noopener nofollow">Newsroom</a>` : ''}${!fp || (!fp.newsroom_url && !Object.values(fp.accounts || {}).some(Boolean)) ? '<span class="muted">No account links recorded</span>' : ''}</div></div>` };
  const fsel = sel !== 'all' ? N.follow_parties[sel] : null;
  const people = sel !== 'all' ? (N.follow_people || []).filter(p => p.party === sel).sort(ptBySurname) : [];
  const follow = `<section class="stack" aria-labelledby="h-follow"><div class="shead"><div class="shead__row"><h2 id="h-follow">${sel === 'all' ? 'Follow the parties' : 'Follow ' + esc(pname(sel))}</h2><span class="micro muted">Official accounts only · no follower counts</span></div></div>
      <div class="follow">${(sel === 'all' ? parties : [sel]).map(followRow).join('')}</div>
      ${fsel && Object.values(fsel.verified || {}).some(v => v === false) ? '<p class="micro muted">Some account links could not be checked against the party’s own website (it blocks automated access) and come from Wikidata.</p>' : ''}
      ${sel === 'all' ? '<p class="small muted">Candidates’ and MPs’ own accounts are listed on each party’s page here: pick a party above.</p>' : people.length ? `<details class="disclose"><summary>Candidates and MPs <span class="micro muted" style="margin-left:auto">${people.length}, A to Z</span></summary><div class="disclose__body"><p class="micro muted">Public accounts they listed themselves. Office email addresses only.</p><div class="follow">${people.map(p => { const em = officeEmail(p.email, p.party, N); const links = acctLinks(p.accounts, p.other) + (em ? `<a href="mailto:${esc(em)}">Email</a>` : '');
          return `<div class="follow__row"><span><button class="linkbtn" type="button" data-person="${esc(p.folder)}">${esc(p.name)}</button>${p.electorate_2026 ? `<span class="micro muted" style="display:block">${esc(p.electorate_2026)}</span>` : ''}</span><div class="follow__links">${links || '<span class="muted">No public accounts listed</span>'}</div></div>` }).join('')}</div></div></details>` : ''}
    </section>`;
  const updated = N.updated ? new Date(N.updated) : null;
  $('#main').innerHTML = sectionFrame('parties', 'parties/news', `<header class="pagehead"><p class="eyebrow eyebrow--signal">${ic('news', 'i--s')} Parties · From the parties</p><h1>${sel === 'all' ? 'From the parties' : 'From ' + esc(pname(sel))}</h1>
      <p class="lede">${sel === 'all' ? `The latest press releases from every party, three each, A to Z.` : `The latest press releases from ${esc(P(sel).name || pname(sel))}.`} The parties’ own words: headlines link to the original. For what the parties have actually done, see <a href="#/parties/promises">Promises</a>.</p>
      ${sel === 'all' ? `<div class="row"><div class="seg" role="group" aria-label="Layout">${[['three', 'Three per party'], ['newest', 'Newest first']].map(([k, l]) => `<button type="button" data-mode="${k}" aria-pressed="${mode === k}">${l}</button>`).join('')}</div></div>` : ''}</header>
    <div class="chips chips--scroll news-chips" role="group" aria-label="Party">${[['all', 'All parties'], ...parties.map(p => [p, pname(p)])].map(([k, l]) => `<button class="chip" type="button" data-go="parties/news${k === 'all' ? '' : '/' + esc(k)}" aria-pressed="${k === sel}">${k !== 'all' ? `<span class="sw" style="--pc:${pcolor(k)}"></span>` : ''}${esc(l)}</button>`).join('')}</div>

/* ----- Policy swipe -----
   Real 2026 policies, party hidden (data/swipe.json is leak-filtered at build time). Decide, then see whose it was.
   Rounds of 20 cards, dealt by weighted round-robin so no party floods the deck. Tally = agreement rate per party, A–Z. */
const SWIPE_ROUND = 20;

  Object.values(byParty).forEach(a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } });
  const deck = [];

    deck.push(byParty[pick].shift()) }

}

/* ===== Choose: hub, your results, compare two parties (+ helpers shared by the four tools) =====
   IA.md §2.4: four lenses, not four versions of one quiz. Party names hidden until answered; never a single winner;
   every result page carries RESULT_DISCLAIMER and a "How this could be wrong" block; answers stay in localStorage
   (keys quiz2, swipe, compass, game). */

/* ----- helpers ----- */
// The 17 registered parties the guide covers. Every result lists all of them.
function chooseParties() { const g = (G().parties || []).map(p => p.slug); return g.length ? g : Object.keys((G().quiz2 || {}).parties || {}) }
function chooseAZ(slugs) { return slugs.slice().sort((a, b) => pname(a).localeCompare(pname(b), 'en', { sensitivity: 'base' })) }

/* ----- compare two parties ----- */
V.compare = (arg) => {
  const all = chooseAZ(chooseParties()); let pick = String(arg || '').split('-vs-').filter(s => all.includes(s)).slice(0, 2);
  const draw = () => {
    const [a, b] = chooseAZ(pick); const two = pick.length === 2;
    const chips = all.map(s => `<button class="chip" type="button" data-pick="${esc(s)}" aria-pressed="${pick.includes(s)}" style="--pc:${pcolor(s)}"><span class="sw"></span>${esc(pname(s))}</button>`).join('');
    $('#main').innerHTML = sectionFrame('choose', 'choose/compare', `
      ${chooseHead('swap', 'Choose · Compare two parties', 'Compare two parties', `Pick any two of the ${all.length}. Each gets the same fields in the same order, from the party’s own material and reporting, with sources.`)}
      <section class="stack" aria-labelledby="h-pick"><h2 id="h-pick" class="h4">${two ? 'Comparing' : pick.length ? 'Pick one more party' : 'Pick two parties'}</h2>
        <div class="chips" role="group" aria-labelledby="h-pick">${chips}</div>
        <p class="micro muted">Listed A–Z. ${two ? 'Pick another party to swap it for the one you chose first.' : ''}</p></section>
      ${two ? compareBody(a, b) : `<div class="panel panel--sunk"><p class="soft">You’ll see their summaries, big ideas, who they’d work with, whether their promises are costed, what they and their critics say, and where they stand on each issue — both parties side by side.</p></div>`}`);
    $('#main').querySelectorAll('[data-pick]').forEach(btn => btn.onclick = () => { const s = btn.dataset.pick;
      if (pick.includes(s)) pick = pick.filter(x => x !== s); else { pick.push(s); if (pick.length > 2) pick.shift() }
      const path = 'choose/compare' + (pick.length === 2 ? '/' + chooseAZ(pick).join('-vs-') : pick.length === 1 ? '/' + pick[0] : '');
      S.route = path; try { history.replaceState(history.state, '', '#/' + path) } catch {}
      const y = scrollY; draw(); scrollTo(0, y) });
  };
  draw();
};
function compareBody(a, b) {
  const ga = guideParty(a) || {}, gb = guideParty(b) || {};
  const cell = (s, html) => `<div class="cmp__cell" style="--pc:${pcolor(s)}"><span class="ptag ptag--s"><span class="sw"></span>${esc(pname(s))}</span>${html}</div>`;
  const pair = (title, fa, fb, id) => `<section class="stack" aria-labelledby="cmp-${id}"><div class="shead"><h2 id="cmp-${id}" class="h3">${title}</h2></div><div class="cmp__pair">${cell(a, fa(ga, a))}${cell(b, fb ? fb(gb, b) : fa(gb, b))}</div></section>`;
  const none = '<p class="small muted">Not recorded.</p>';
  const nutshell = g => g.in_a_nutshell ? `<p>${esc(g.in_a_nutshell)}</p>${chooseSrc(g.sources)}` : none;
  const ideas = (g, s) => (g.big_ideas || []).length ? `<ol class="ideas">${g.big_ideas.map(x => `<li><div><span style="font-weight:600">${esc(T(x))}</span>${(x.policy_ids || []).length ? `<span class="micro muted">${x.policy_ids.length} polic${x.policy_ids.length === 1 ? 'y' : 'ies'}</span>` : ''}</div></li>`).join('')}</ol><a class="more small" href="#/parties/${esc(s)}/policies">All ${esc(pname(s))} policies ${ic('chev', 'i--xs')}</a>` : none;
  const pchips = (arr, no) => (arr || []).length ? `<div class="row">${arr.map(x => `<span class="pchip${no ? ' pchip--no' : ''}" style="--pc:${pcolor(x)}"><span class="sw"></span>${esc(pname(x))}</span>`).join('')}</div>` : '<span class="small muted">None stated</span>';
  const works = g => { const c = g.coalition_stance_2026; if (!c) return none;
    return `<p>${esc(c.summary || '')}</p><div class="works"><div class="works__row"><span>Open to</span>${pchips(c.open_to)}</div><div class="works__row"><span>Ruled out</span>${pchips(c.rules_out, true)}</div></div>${chooseSrc(c.sources, c.as_of ? 'As of ' + esc(c.as_of) : '')}` };
  const costed = g => { const c = g.costings; if (!c) return none; const word = c.published === true ? 'Costings published' : c.published === false ? 'No costings published' : 'Partly costed';
    return `<p><span class="badge${c.published === true ? ' badge--ink' : ' badge--outline'}">${word}</span></p>${c.summary ? `<p class="small soft">${esc(c.summary)}</p>` : ''}${chooseSrc(c.sources, c.date ? esc(c.date) : '')}` };
  const said = (v, critics) => v && T(v) ? `<div class="side${critics ? ' side--critics' : ''}"><span class="eyebrow">${critics ? 'What critics say' : 'What they say'}</span><blockquote>${esc(T(v))}</blockquote>${chooseSrc(srcOf(v), [v.attribution, v.date].filter(Boolean).map(esc).join(' · '))}</div>` : '';
  const sides = g => said(g.they_say) + said(g.critics_say, true) || none;
  const iss = (G().issues || []).slice().sort((x, y) => String(x.title).localeCompare(String(y.title)));
  const both = iss.filter(i => (i.positions || {})[a] && (i.positions || {})[b]);
  const one = iss.filter(i => !both.includes(i) && ((i.positions || {})[a] || (i.positions || {})[b]));
  const pos = (i, s) => { const p = i.positions[s]; return `<p class="small">${esc(T(p))}</p>${chooseSrc(srcOf(p))}` };
  return `<div class="cmp stack stack--xl">
    <div class="cmp__pair cmp__heads" aria-hidden="true">${[a, b].map(s => `<div class="cmp__cell" style="--pc:${pcolor(s)}"><span class="h4">${esc(pname(s))}</span><span class="micro muted">${esc((guideParty(s) || {}).name || P(s).name || '')}</span></div>`).join('')}</div>
    ${pair('In a nutshell', nutshell, null, 'nut')}
    ${pair('Big ideas', ideas, null, 'ideas')}
    ${pair('Who they’d work with', works, null, 'works')}
    ${pair('Costed?', costed, null, 'cost')}
    ${pair('Two sides', sides, null, 'sides')}
    <section class="stack" aria-labelledby="cmp-iss"><div class="shead"><div class="shead__row"><h2 id="cmp-iss" class="h3">Where they stand on the issues</h2><span class="micro muted">${both.length} issue${both.length === 1 ? '' : 's'} where both have a position · A–Z</span></div></div>
      ${both.length ? both.map(i => `<div class="stack stack--s"><div class="shead shead--quiet"><div class="shead__row"><h3 class="h4">${esc(i.title)}</h3><a class="more small" href="#/parties/issues/${esc(i.slug)}">All parties ${ic('chev', 'i--xs')}</a></div></div><div class="cmp__pair">${cell(a, pos(i, a))}${cell(b, pos(i, b))}</div></div>`).join('') : '<p class="small muted">No issue where both parties have a recorded position.</p>'}

/* ----- electorate map ----- */
const MAP_YEARS = [2011, 2014, 2017, 2020, 2023, 2026];
const slugify = n => String(n || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/^mount-|^mount /, 'mt-').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').replace(/^mount-/, 'mt-').replace(/-electorate$/, '');
async function loadGeo(setId) { S.geo = S.geo || {}; if (!S.geo.index) S.geo.index = await getJSON('data/geo/index.json');
  for (const t of ['general', 'maori']) { const k = `${t}-${setId}`; if (!S.geo[k]) S.geo[k] = await getJSON(`data/geo/${k}.json`).catch(() => ({ features: [] })) } return S.geo }
function projector(bbox, W, H) { const [x0, y0, x1, y1] = bbox; const midLat = (y0 + y1) / 2, kx = Math.cos(midLat * Math.PI / 180);
  const sw = (x1 - x0) * kx, sh = (y1 - y0), sc = Math.min(W / sw, H / sh); const ox = (W - sw * sc) / 2, oy = (H - sh * sc) / 2;
  return ([lon, lat]) => [ox + (lon - x0) * kx * sc, oy + (y1 - lat) * sc] }
function featPath(f, proj, bbox) { const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates; let d = '';
  for (const poly of polys) { const ring = poly[0]; if (!ring || !ring.length) continue; if (ring[0][0] > 180 || ring[0][0] < bbox[0] - 1 || ring[0][0] > bbox[2] + 1 || ring[0][1] < bbox[1] - 1 || ring[0][1] > bbox[3] + 1) continue;
    d += ring.map((c, i) => { const [x, y] = proj(c); return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1) }).join('') + 'Z' } return d }
function electorateResults(year) { // slug -> {party, winner, majority, runner_up, ...}
  const out = {};
  if (year === 2026) { const R = results2026(); if (R && (R.electorates || []).length) { for (const r of R.electorates) out[slugify(r.name || r.slug)] = { ...r, live: true }; return out }
    for (const e of S.data.electorates || []) out[slugify(e.slug)] = { party: e.sitting_mp ? e.sitting_mp.party : null, winner: e.sitting_mp ? e.sitting_mp.name : 'Vacant', pending: true, e }; return out }
  const el = S.data.elections.find(x => x.year === year); for (const r of (el && el.electorates) || []) out[slugify(r.name)] = r; return out }
// The map's land and seat polygons for one bbox, as <path>s with a data-driven fill. Chatham Islands (+360 longitudes) are skipped by featPath.
function mapPaths(feats, resFor, bbox, W, H, sel) { const proj = projector(bbox, W, H);
  const one = f => { const d = featPath(f, proj, bbox); if (!d) return ''; const r = resFor(f);
    return `<path${sel === f.properties.slug ? ' class="is-sel"' : ''} data-slug="${esc(f.properties.slug)}" d="${d}" style="fill:${r && r.party ? pcolor(r.party) : 'var(--seat-empty)'}"><title>${esc(mapTitle(f, r))}</title></path>` };
  // the selected seat is drawn last so its outline sits on top
  return feats.filter(f => f.properties.slug !== sel).map(one).join('') + feats.filter(f => f.properties.slug === sel).map(one).join('') }
const mapTitle = (f, r) => f.properties.name + (r ? ' · ' + (r.winner || '') + (r.party ? ' (' + pname(r.party) + ')' : '') : ' · no result on record');
async function mapContext(year, type) { const idx = S.geo.index; const setId = idx.election_to_boundary_set[year]; await loadGeo(setId);
  const feats = (S.geo[`${type}-${setId}`] || {}).features || []; const res = electorateResults(year); const aliases = ((idx.boundary_sets[setId] || {}).aliases) || {};
  const resFor = f => res[f.properties.slug] || res[aliases[f.properties.slug]] || res[slugify(f.properties.name)] || Object.values(res).find(r => r.e && slugify(r.e.name) === f.properties.slug) || null;
  return { idx, setId, feats, res, resFor } }

  const seatsFor = v => v === 'proj' ? projection().seats : v === 'r2026' ? Object.fromEntries((R.parties || []).filter(r => r.total_seats).map(r => [r.party, r.total_seats]))
    : Object.fromEntries((els.find(e => `e${e.year}` === v).parties || []).filter(r => r.total_seats).map(r => [r.party, r.total_seats]));

/* ----- seat calculator (MMP: 5% or an electorate, Sainte-Laguë, overhang) ----- */
function parlCalculator() {

  const fromResult = () => { const pct = {}, elec = {}; (e23.parties || []).filter(r => r.party_vote_pct >= 1 || r.electorate_seats).forEach(r => { pct[r.party] = r.party_vote_pct; if (r.electorate_seats) elec[r.party] = r.electorate_seats }); return { pct, elec, label: `the ${e23.year} election result` } };
  let start = hide ? fromResult() : fromPolls();

  const load = s => { start = s; pct = {}; elec = {}; Object.keys({ ...s.pct, ...s.elec }).forEach(p => { pct[p] = Math.round((s.pct[p] || 0) * 10) / 10; elec[p] = s.elec[p] || 0 }) };

    <div class="row"><span class="small muted">Start from</span><div class="seg" role="group" aria-label="Start from" id="cstart">${hide ? '' : `<button type="button" data-s="polls" aria-pressed="true">Latest polls</button>`}<button type="button" data-s="result" aria-pressed="${hide}">${e23.year} result</button></div></div>
    <div class="split split--7-5">
      <div class="stack"><p class="small soft" id="cfrom"></p><div class="calc" id="calc"></div>
        <div class="row"><button class="btn btn--s" type="button" id="csave">Use these electorate wins in the 2026 projection</button></div></div>
      <div class="stack sticky" aria-live="polite"><div class="row" style="align-items:baseline;gap:var(--s-3)"><span class="figure figure--s" id="ctot">120</span><span class="soft" id="cmaj"></span></div>
        <div id="calchemi"></div><div id="cbars"></div><p class="small soft" id="csum"></p></div>
    </div>

  const run = () => { const e = {}; for (const p in elec) if (elec[p]) e[p] = elec[p];

/* ----- trend chart: a 360-wide lines-only SVG for phones and a 900-wide one with dots; CSS shows one ----- */
function pollChart(polls, parties, { long = false } = {}) {
  const label = long ? 'Party vote at each election since 2008, then every published poll since 2023 with an 8-poll rolling average' : 'Party vote in every published poll since the 2023 election, with an 8-poll rolling average';
  return trendSVG(polls, parties, 360, 300, false, long, label) + trendSVG(polls, parties, 900, 340, true, long, label) +
    `<figcaption class="micro muted">Lines: average of each party's last 8 polls${long ? '; solid dots joined by a dashed line: election results' : ''}. Dots (on wider screens): individual polls. Same 0–${long ? 55 : 45}% scale for every party.</figcaption>` }
function trendSVG(polls, parties, W, H, dots, long, label) {
  const L = W < 500 ? 30 : 34, R = W < 500 ? 36 : 44, T = 12, B = 24;
  const t0 = new Date(long ? '2008-06-01' : '2023-10-01').getTime(), t1 = new Date(long ? '2026-12-15' : '2026-11-14').getTime(), maxV = long ? 55 : 45;
  const xs = d => L + (new Date(d).getTime() - t0) / (t1 - t0) * (W - L - R), ys = v => T + (1 - v / maxV) * (H - T - B);
  const ticks = long ? [0, 10, 20, 30, 40, 50] : [0, 10, 20, 30, 40];
  let g = `<g class="grid">${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${ys(v).toFixed(1)}" y2="${ys(v).toFixed(1)}"/>`).join('')}</g>` + ticks.map((v, k) => `<text x="${L - 6}" y="${(ys(v) + 4).toFixed(1)}" text-anchor="end">${v}${k === ticks.length - 1 ? '%' : ''}</text>`).join('');
  const years = long ? (W < 500 ? [2011, 2017, 2023] : [2008, 2011, 2014, 2017, 2020, 2023]) : [2024, 2025, 2026];
  g += years.map(y => `<text x="${xs(long ? y + '-11-01' : y + '-01-01').toFixed(1)}" y="${H - 6}" text-anchor="middle">${y}</text>`).join('');
  g += `<line class="thr" x1="${L}" x2="${W - R}" y1="${ys(5).toFixed(1)}" y2="${ys(5).toFixed(1)}"/><text class="thr-l" x="${xs(long ? '2009-06-01' : '2023-12-15').toFixed(1)}" y="${(ys(5) - 5).toFixed(1)}">5% threshold</text>`;
  g += `<line class="eday" x1="${xs('2026-11-07').toFixed(1)}" x2="${xs('2026-11-07').toFixed(1)}" y1="${T}" y2="${H - B}"/><text class="eday-l" x="${(xs('2026-11-07') - 4).toFixed(1)}" y="${T + 10}" text-anchor="end">7 Nov</text>`;
  const sorted = polls.slice().sort((a, b) => a.date.localeCompare(b.date));
  const els = (S.data.elections || []).filter(e => e.year >= (long ? 2008 : 2023) && e.year < 2026);
  const ends = [];
  for (const p of parties) { const pc = pcolor(p); const pp = sorted.filter(x => typeof x.parties[p] === 'number');
    let part = '';
    const res = els.map(e => { const r = (e.parties || []).find(x => x.party === p); return r && r.party_vote_pct != null ? [e.date || e.year + '-11-01', r.party_vote_pct, e.year] : null }).filter(Boolean);
    if (long && res.length > 1) part += `<polyline class="elx" points="${res.map(([d, v]) => `${xs(d).toFixed(1)},${ys(v).toFixed(1)}`).join(' ')}"/>`;
    part += res.map(([d, v, y]) => `<circle class="res" cx="${xs(d).toFixed(1)}" cy="${ys(v).toFixed(1)}" r="${W < 500 ? 3.5 : 4.5}" data-tip="${y} election result · ${esc(pname(p))} ${fmt(v, 2)}%"></circle>`).join('');
    if (dots) part += pp.map(x => `<circle class="dot" cx="${xs(x.date).toFixed(1)}" cy="${ys(x.parties[p]).toFixed(1)}" r="3" data-tip="${esc(x.pollster)} · ${esc(seatDate(x.date))} · ${esc(pname(p))} ${fmt(x.parties[p])}%${x.sample_size ? ' · sample ' + Number(x.sample_size).toLocaleString('en-NZ') : ''}"></circle>`).join('');
    if (pp.length > 3) { const avg = pp.map((x, i) => { const w = pp.slice(Math.max(0, i - 7), i + 1); return [x.date, w.reduce((a, y) => a + y.parties[p], 0) / w.length] });
      const xy = avg.map(([d, v]) => [xs(d), ys(v)]); let len = 0; for (let k = 1; k < xy.length; k++) len += Math.hypot(xy[k][0] - xy[k - 1][0], xy[k][1] - xy[k - 1][1]);
      part += `<polyline class="avg" style="--len:${Math.ceil(len)}" points="${xy.map(([a, b]) => `${a.toFixed(1)},${b.toFixed(1)}`).join(' ')}"/>`;
      const [ld, lv] = avg[avg.length - 1]; ends.push({ x: xs(ld) + 5, y: ys(lv) + 4, v: lv, p }) }
    g += `<g style="--pc:${pc}">${part}</g>` }
  // end labels, nudged apart so they don't overlap
  ends.sort((a, b) => a.y - b.y); for (let k = 1; k < ends.length; k++) if (ends[k].y - ends[k - 1].y < 12) ends[k].y = ends[k - 1].y + 12;
  g += ends.map(e => `<text class="end" x="${e.x.toFixed(1)}" y="${e.y.toFixed(1)}">${Math.round(e.v)}</text>`).join('');
  return `<svg class="chart ${dots ? 'chart--wide' : 'chart--narrow'}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}</svg>` }
// Seats after each election (stacked, 61 tick) and turnout vs wasted vote, since 2008 (from the old Parliament › trends tab)
function pastElectionsCharts() {

/* ----- global search: typed results (party, person, policy, electorate, issue, page) ----- */
const fold = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
async function searchIndex() {
  if (S.searchIdx) return S.searchIdx;
  await loadPeople(); if (!S.policies) S.policies = await getJSON('data/policies.json').catch(() => ({})); await loadPages();
  const idx = [];
  for (const g of (G().parties || [])) idx.push({ kind: 'Party', title: g.name, sub: g.tagline || '', go: 'parties/' + g.slug, pc: pcolor(g.slug), key: fold(g.name + ' ' + (g.short_name || '') + ' ' + pname(g.slug)) });
  for (const p of (S.people || [])) idx.push({ kind: 'Person', title: p.name, sub: [pname(p.party), p.electorate_2026 ? p.electorate_2026 : '', STATUS[p.status] || ''].filter(Boolean).join(' · '), person: p.folder, pc: pcolor(p.party), key: fold(p.name) });
  for (const [party, list] of Object.entries(S.policies || {})) for (const x of list) idx.push({ kind: 'Policy', title: x.statement, sub: pname(party) + (x.topic_group ? ' · ' + (TOPIC_NAMES[x.topic_group] || x.topic_group) : ''), go: `parties/${party}/policies`, pc: pcolor(party), key: fold(x.statement + ' ' + (x.summary && x.summary.why || '')) });
  for (const e of (S.data.electorates || [])) idx.push({ kind: 'Electorate', title: e.name, sub: (e.type === 'maori' ? 'Māori electorate' : 'General electorate') + (e.region ? ' · ' + e.region : ''), go: 'vote/electorate/' + e.slug, key: fold(e.name + ' ' + (e.region || '')) });
  for (const i of (G().issues || [])) idx.push({ kind: 'Issue', title: i.title, sub: i.why_it_matters || '', go: 'parties/issues/' + i.slug, key: fold(i.title + ' ' + (i.why_it_matters || '')) });
  for (const k of Object.keys(S.pages || {})) if (!/\/people\//.test(k)) idx.push({ kind: 'Page', title: pageTitle(k), sub: k, go: 'about/page/' + k, key: fold(pageTitle(k) + ' ' + k) });
  return (S.searchIdx = idx) }
function searchRun(idx, q) { const terms = fold(q).split(/\s+/).filter(t => t.length > 1); if (!terms.length) return [];
  const scored = []; for (const it of idx) { let s = 0; for (const t of terms) { const i = it.key.indexOf(t); if (i < 0) { s = -1; break } s += i === 0 || it.key[i - 1] === ' ' ? 3 : 1 } if (s > 0) scored.push([s + (it.kind === 'Party' ? 2 : it.kind === 'Person' || it.kind === 'Electorate' ? 1 : 0), it]) }
  return scored.sort((a, b) => b[0] - a[0] || a[1].title.localeCompare(b[1].title)).slice(0, 60).map(x => x[1]) }
V.search = async q => {
  $('#main').innerHTML = `<div class="stack stack--l" style="max-width:820px"><header class="pagehead"><p class="eyebrow">Search</p><h1>Search the guide</h1><p class="lede">Parties, people, policies, electorates, issues and pages. Results are listed by how well they match, then A–Z.</p></header>
    <div class="input-icon">${ic('search', 'i--s')}<input class="input" id="sq" type="search" value="${esc(q || '')}" placeholder="Try a name, a place or a policy word" aria-label="Search" autocomplete="off"></div>
    <div id="sres" class="rows" aria-live="polite"></div></div>`;
  const idx = await searchIndex(); const out = $('#sres'); const inp = $('#sq');
  const draw = () => { const v = inp.value.trim(); try { history.replaceState(null, '', '#/search/' + encodeURIComponent(v)) } catch {}
    const rs = searchRun(idx, v); if (!v) { out.innerHTML = `<p class="small muted">Type to search. Press <kbd>/</kbd> anywhere to come back here.</p>`; return }
    if (!rs.length) { out.innerHTML = `<p class="empty">Nothing matched “${esc(v)}”. Try fewer or different words.</p>`; return }

  inp.oninput = draw; draw(); if (!q) inp.focus();

/* ----- routes ----- */
// Old hash / data-go value → new path. Anything already in new form passes through.
const OLD_ROUTES = { home: 'today', more: 'today', match: 'choose/quiz', swipe: 'choose/swipe', 'swipe-tally': 'choose/swipe', compass: 'choose/compass', game: 'choose/game',
  parties: 'parties', issues: 'parties/issues', policies: 'parties/policies', promises: 'parties/promises', people: 'parties/people', newsroom: 'parties/news',
  electorate: 'vote/electorate', vote: 'vote', map: 'seats/map', polls: 'seats/polls', trends: 'seats/polls', parliament: 'seats/parliament', chamber: 'seats/parliament',
  coalition: 'seats/coalition', calculator: 'seats/calculator', trust: 'about/trust', search: 'search', choose: 'choose', seats: 'seats/polls', today: 'today', results: 'seats/results' };
function normaliseRoute(r) { r = String(r || '').replace(/^#/, ''); if (r.startsWith('/')) return r.replace(/^\/+/, '').replace(/\/+$/, '') || 'today';
  if (!r) return 'today'; if (OLD_ROUTES[r]) return OLD_ROUTES[r];
  const m = r.match(/^(party|issue|electorate|newsroom)-(.+)$/); if (m) return { party: 'parties/', issue: 'parties/issues/', electorate: 'vote/electorate/', newsroom: 'parties/news/' }[m[1]] + m[2];
  return r }
// path → { sec, view, args, key }  (key is the sub-navigation item to highlight)
function resolve(path) { const seg = path.split('/'); const [a, b, ...rest] = seg; const arg = rest.join('/') || undefined;
  if (a === 'today') return { sec: 'today', view: 'home', args: [] };
  if (a === 'search') return { sec: null, view: 'search', args: [b ? decodeURIComponent(b) : ''] };
  if (a === 'about') { if (!b || b === 'trust') return { sec: null, view: 'trust', args: [] }; if (b === 'page') return { sec: null, view: 'page', args: [arg] }; return { sec: null, view: 'trust', args: [] } }
  if (a === 'vote') { if (b === 'electorate') return { sec: 'vote', view: 'electorate', args: [arg], key: 'vote/electorate' }; return { sec: 'vote', view: 'vote', args: [b], key: 'vote' + (b ? '/' + b : '') } }
  if (a === 'choose') { const v = { quiz: 'match', swipe: 'swipe', compass: 'compass', game: 'game', compare: 'compare', results: 'chooseResults' }[b]; return { sec: 'choose', view: v || 'choose', args: [arg], key: 'choose' + (b ? '/' + b : '') } }
  if (a === 'parties') { if (!b) return { sec: 'parties', view: 'parties', args: [], key: 'parties' };
    if (b === 'issues') return { sec: 'parties', view: arg ? 'issue' : 'issues', args: [arg], key: 'parties/issues' };
    if (b === 'policies') return { sec: 'parties', view: 'policies', args: [arg], key: 'parties/policies' };
    if (b === 'promises') return { sec: 'parties', view: 'promises', args: [arg], key: 'parties/promises' };
    if (b === 'people') return { sec: 'parties', view: 'people', args: [arg], key: 'parties/people' };
    if (b === 'news') return { sec: 'parties', view: 'newsroom', args: [arg], key: 'parties/news' };
    return { sec: 'parties', view: 'party', args: [b, arg || 'glance'], key: 'parties' } }
  if (a === 'seats') { const sub = b || 'polls';
    if (sub === 'polls') return { sec: 'seats', view: 'polls', args: [], key: 'seats/polls' };
    if (sub === 'map') return { sec: 'seats', view: 'map', args: [rest[0] ? +rest[0] : undefined, rest[1]], key: 'seats/map' };
    if (sub === 'parliament') return { sec: 'seats', view: 'parliament', args: ['chamber'], key: 'seats/parliament' };
    if (sub === 'coalition' || sub === 'calculator') return { sec: 'seats', view: 'parliament', args: [sub], key: 'seats/' + sub };
    if (sub === 'results') return { sec: 'seats', view: 'results', args: [], key: 'seats/results' } }
  return { sec: 'today', view: 'home', args: [] } }
// Navigate. Pushes a history entry via the hash; render() runs from the hashchange handler.
function go(r) { const path = normaliseRoute(r); if ($('#sheet').open) { const d = $('#sheet'); d.close(); if (history.state && history.state.sheet) { history.back(); setTimeout(() => { location.hash = '/' + path }, 0); return } }

    await V[R.view](...R.args);
    loadPeople().then(() => { if (S.route === path) main.querySelectorAll('.read, .prose, .quote, .pol p, .lede, #ctx, .mapside, .feed__t, .side, .nutshell').forEach(autolink);

  const run = () => { window.scrollTo(0, 0); main.classList.remove('page-enter'); void main.offsetWidth; main.classList.add('page-enter'); return swap() };
  if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.startViewTransition(run); else run();

  const ip = e.target.closest('[data-issuepol]'); if (ip) { const [p, ids] = ip.dataset.issuepol.split('|'); showIssuePolicies(p, ids); return }
  const pg = e.target.closest('[data-page]'); if (pg) { openPage(pg.dataset.page); return }
  const a = e.target.closest('.prose a'); if (a) { const href = a.getAttribute('href') || '';
    if (!/^https?:|^mailto:|^#/.test(href) && /\.(md|json)(#.*)?$|\/$/.test(href)) { e.preventDefault(); const base = (a.closest('[data-base]') || {}).dataset?.base || ''; const parts = base.split('/').slice(0, -1);
      href.replace(/#.*$/, '').split('/').forEach(s => { if (s === '..') parts.pop(); else if (s && s !== '.') parts.push(s) }); let k = parts.join('/'); if (!/\.md$/.test(k)) k = k.replace(/\/?$/, '/README.md'); openPage(k) } }
  // in-app links inside the sheet: close the sheet first so the page behind changes
  const ha = e.target.closest('#sheet a[href^="#/"]'); if (ha) { e.preventDefault(); go(ha.getAttribute('href').slice(1)) }
});
document.addEventListener('keydown', e => { if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !$('#sheet').open) { e.preventDefault(); go('search') } });

/* ----- boot ----- */
(async () => {
  try { const t = localStorage.getItem('bb-theme'); if (t) document.documentElement.dataset.theme = t } catch {}
  document.body.classList.add('has-tabbar'); bindTheme(); bindSearch(); drawNav();
  try { S.data = await getJSON('data/bundle.json') } catch (e) { $('#main').innerHTML = `<p class="empty">The guide's data didn't load (${esc(e.message)}).</p>`; return }
  drawFooter();
  const start = normaliseRoute(location.hash);
  window.addEventListener('hashchange', () => { const p = normaliseRoute(location.hash); if (location.hash !== '#/' + p) { history.replaceState(null, '', '#/' + p); } if (p !== S.route) render(p) });
  if (location.hash !== '#/' + start) history.replaceState(null, '', '#/' + start);
  render(start);
  loadPeople().then(() => { if (['today', 'parties'].includes(S.route)) render(S.route) });
})();
})();

</script>
